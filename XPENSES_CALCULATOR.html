<!DOCTYPE html>
<html lang="en">
<head>
<script src="lib/pwa.js"></script>
<script src="lib/sync-auth.js"></script>
<script src="lib/sync.js"></script>
<script src="lib/drive.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpenses Calculator</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── Design tokens ── */
:root {
  --bg-page:      #f0ede8;
  --bg-card:      #ffffff;
  --bg-sub:       #f0eee9;
  --bg-hover:     #e8e5e0;
  --text-1:       #1a1917;
  --text-2:       #6b6962;
  --text-3:       #9e9c96;
  --border-1:     rgba(0,0,0,0.10);
  --border-2:     rgba(0,0,0,0.18);
  --r-md:         8px;
  --r-lg:         14px;
  --r-xl:         18px;
  /* Semantic colours */
  --green:        #0a7a5e;
  --green-border: #1aaa84;
  --green-bg:     #e8f5f0;
  --green-box:    #c2e8da;
  --blue:         #1a5fa8;
  --blue-border:  #3d8fe0;
  --blue-bg:      #e8f1fb;
  --blue-box:     #b8d4f5;
  --red:          #a82d2d;
  --red-border:   #e04545;
  --purple:       #5b4eba;
  --purple-border:#8070e0;
  --purple-bg:    #edeafc;
  --amber:        #8a5200;
  --amber-border: #c47a00;
  --amber-bg:     #fdf3e3;
  --amber-box:    #f0d29a;
  /* Tab accent — Now is teal (different from Drive blue), FIRE is orange */
  --tab-now:      #0d8a6a;
  --tab-fire:     #b84a00;
  /* Fonts */
  --font-ui:      'Inter', system-ui, -apple-system, sans-serif;
  --font-logo:    'Plus Jakarta Sans', system-ui, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:      #141412;
    --bg-card:      #1e1d1b;
    --bg-sub:       #272521;
    --bg-hover:     #2e2c28;
    --text-1:       #e8e5dc;
    --text-2:       #9e9b93;
    --text-3:       #6b6860;
    --border-1:     rgba(255,255,255,0.09);
    --border-2:     rgba(255,255,255,0.16);
    --green:        #4dbb98;
    --green-border: #1aaa84;
    --green-bg:     #0d2a20;
    --green-box:    #1a4a38;
    --blue:         #6aaae8;
    --blue-border:  #3d8fe0;
    --blue-bg:      #0d1e38;
    --blue-box:     #1a3a60;
    --red:          #e88080;
    --red-border:   #e04545;
    --purple:       #a898f0;
    --purple-border:#8070e0;
    --purple-bg:    #1e1840;
    --amber:        #e8a020;
    --amber-border: #c47a00;
    --amber-bg:     #2a1d08;
    --amber-box:    #5a3e10;
    --tab-now:      #2ec99a;
    --tab-fire:     #e87040;
  }
}

/* ── Base ── */
body {
  font-family: var(--font-ui);
  background: var(--bg-page);
  color: var(--text-1);
  min-height: 100vh;
  padding-top: 72px; /* desktop: single-row header */
  -webkit-font-smoothing: antialiased;
}

/* ── Sticky header ── */
.sticky-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-1);
  box-shadow: 0 1px 12px rgba(0,0,0,0.07);
}

/* Desktop: one row — logo | tabs (center) | actions */
.header-row {
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 1.5rem;
  gap: 16px;
  max-width: 1280px;
  margin: 0 auto;
}

.home-link {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  opacity: 0.85;
  transition: opacity 0.15s;
  text-decoration: none;
}
.home-link:hover { opacity: 1; }

/* Logo — left */
.header-logo {
  font-family: var(--font-logo);
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.5px;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}
.logo-x    { color: var(--tab-now); }
.logo-rest { color: var(--text-1); }
.logo-sep  { color: var(--text-3); font-weight: 400; font-size: 14px; margin: 0 4px; }
.logo-calc { color: var(--text-3); font-weight: 600; font-size: 14px; }

/* Tabs — center */
.header-tabs {
  flex: 1;
  display: flex;
  justify-content: center;
}

.tabs {
  display: flex;
  background: var(--bg-sub);
  border-radius: 99px;
  padding: 3px;
  gap: 2px;
}

.tab-btn {
  font-family: var(--font-ui);
  font-size: 13px;
  font-weight: 500;
  padding: 6px 26px;
  border: none;
  background: transparent;
  color: var(--text-2);
  border-radius: 99px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.01em;
}
.tab-btn.active[data-tab="now"]  {
  background: var(--tab-now);
  color: #fff;
  box-shadow: 0 2px 10px rgba(13,138,106,0.40);
}
.tab-btn.active[data-tab="fire"] {
  background: var(--tab-fire);
  color: #fff;
  box-shadow: 0 2px 10px rgba(184,74,0,0.35);
}

.logo-icon {
  font-size: 18px;
  margin-left: 8px;
  line-height: 1;
  vertical-align: middle;
  position: relative;
  top: -1px;
}

.header-divider {
  width: 1px;
  height: 28px;
  background: var(--border-1);
  flex-shrink: 0;
  margin: 0 4px;
}

/* Actions — right */
.header-actions {
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}

/* Drive status below the header row */
.drive-status-bar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 3px 1.5rem 5px;
  max-width: 1280px;
  margin: 0 auto;
}
.drive-status {
  font-family: var(--font-ui);
  font-size: 10.5px;
  font-weight: 400;
  color: var(--text-3);
  letter-spacing: 0.02em;
  transition: color 0.3s, opacity 0.5s;
  opacity: 0;
  height: 0;
  overflow: hidden;
}
.drive-status.visible { opacity: 1; height: auto; }
.drive-status.ok      { color: var(--green); }
.drive-status.err     { color: var(--red);   }
.drive-status.working { color: var(--amber); }

/* Cloudflare sync status — persistent, slightly larger */
.cf-status {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  letter-spacing: 0.02em;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: color 0.3s;
  min-height: 16px;
}
.cf-status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-3);
  flex-shrink: 0;
  transition: background 0.3s;
}
.cf-status.ok   { color: var(--green); }
.cf-status.ok   .cf-status-dot { background: var(--green); box-shadow: 0 0 4px rgba(26,170,132,0.5); }
.cf-status.err  { color: var(--red);   }
.cf-status.err  .cf-status-dot { background: var(--red); }

/* Mobile: stack logo + actions row, then tabs, then status */
@media (max-width: 680px) {
  body { padding-top: 132px; }
  .sticky-header { padding: 0; }
  .header-row {
    flex-wrap: wrap;
    height: auto;
    padding: 10px 1rem 6px;
    gap: 8px;
    justify-content: center;
  }
  .header-logo { order: 1; }
  .header-tabs { order: 3; width: 100%; }
  .header-actions { order: 2; margin-left: auto; }
  .drive-status-bar { padding: 0 1rem 6px; }
}

/* ── Buttons ── */
.hbtn {
  font-family: var(--font-ui);
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 13px;
  border-radius: 99px;
  border: 1px solid var(--border-2);
  background: transparent;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.hbtn:hover    { background: var(--bg-hover); color: var(--text-1); }
.hbtn:disabled { opacity: 0.4; cursor: not-allowed; }

/* Drive — Google blue */
.hbtn-drive {
  background: #1a73e8;
  border-color: #1a73e8;
  color: #fff;
  font-weight: 600;
}
.hbtn-drive:hover { background: #1558c0; border-color: #1558c0; color: #fff; }


/* ── Autosave toast — green pill with dot ── */
.toast {
  position: fixed;
  bottom: 1.25rem; right: 1.25rem;
  z-index: 999;
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  color: #0a7a5e;
  background: var(--bg-card);
  border: 1px solid #1aaa84;
  border-radius: 99px;
  padding: 6px 14px 6px 10px;
  box-shadow: 0 2px 12px rgba(13,138,106,0.15);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 7px;
}
@media (prefers-color-scheme: dark) {
  .toast { color: #2ec99a; border-color: #1aaa84; background: #0d2a20; }
}
/* Green dot indicator */
.toast::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #1aaa84;
  flex-shrink: 0;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ── Content layout ── */
.dash {
  max-width: 740px;
  margin: 1.5rem auto 3rem;
  padding: 0 1rem;
}

.tab-pane        { display: none; }
.tab-pane.active { display: block; }

.pane-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 1.25rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border-1);
}
.pane-title          { font-family: var(--font-logo); font-size: 22px; font-weight: 700; }
.pane-title.now-col  { color: var(--tab-now); }
.pane-title.fire-col { color: var(--tab-fire); }
.pane-sub            { font-size: 13px; color: var(--text-3); font-style: italic; }

.card {
  background: var(--bg-card);
  border: 1px solid var(--border-1);
  border-radius: var(--r-xl);
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.section-label {
  font-family: var(--font-ui);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 1.25rem 0 0.6rem;
}
.section-label:first-child { margin-top: 0; }

.divider { border: none; border-top: 1px solid var(--border-1); margin: 1.25rem 0; }

/* ── Summary metric cards ── */
.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0,1fr));
  gap: 8px;
}
@media (max-width: 580px) { .metric-grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
.metric-grid .metric .lbl { white-space: normal; overflow: visible; text-overflow: clip; line-height: 1.25; }
.metric.income-total { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.metric.income-total .lbl { font-size: 13px; white-space: normal; overflow: visible; margin-bottom: 4px; }
.metric.income-total .val { font-size: 32px; letter-spacing: -0.6px; line-height: 1.1; }
.metric.income-total .sub { font-size: 12px; margin-top: 4px; }
.sa-total { font-size: 13px; font-weight: 600; color: var(--purple); min-width: 58px; text-align: right; }

.metric {
  background: var(--bg-card);
  border: 1px solid var(--border-2);
  border-radius: var(--r-md);
  padding: 0.7rem 0.85rem;
}
.metric .lbl { font-size: 10px; font-weight: 500; color: var(--text-3); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.02em; }
.metric .val { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
.metric .sub { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.metric.c-green  { border-color: var(--green-border); } .metric.c-green  .val { color: var(--green);  }
.metric.c-blue   { border-color: var(--blue-border);  } .metric.c-blue   .val { color: var(--blue);   }
.metric.c-red    { border-color: var(--red-border);   } .metric.c-red    .val { color: var(--red);    }
.metric.c-purple { border-color: var(--purple-border);} .metric.c-purple .val { color: var(--purple); }
.metric.c-amber  { border-color: var(--amber-border); } .metric.c-amber  .val { color: var(--amber);  }

/* ── Expense section boxes ── */
.box-shared {
  background: var(--blue-bg);
  border: 1px solid var(--blue-box);
  border-radius: var(--r-lg);
  padding: 1rem;
  margin-bottom: 0.5rem;
}
.box-personal {
  background: var(--green-bg);
  border: 1px solid var(--green-box);
  border-radius: var(--r-lg);
  padding: 1rem;
  margin-bottom: 0.5rem;
}
.box-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  margin-bottom: 0.75rem;
}
.box-tracker {
  background: var(--amber-bg);
  border: 1px solid var(--amber-box);
  border-radius: var(--r-lg);
  padding: 1rem;
  margin-bottom: 0.5rem;
}
.box-shared .box-title   { color: var(--blue);  }
.box-personal .box-title { color: var(--green); }
.box-tracker .box-title  { color: var(--amber); }
.link-tag { font-size: 10px; font-weight: 500; color: var(--amber); opacity: .8; margin-left: 6px; white-space: nowrap; }
.spin-wrap .spin-val.linked-val { border: 1px dashed var(--border-2); border-radius: 4px; min-width: 96px; background: transparent; color: var(--text-2); }
@media (max-width: 580px) { .link-tag { display: block; margin-left: 0; white-space: normal; } }
.linked-val::after { content: ' 🔗'; font-size: 10px; }
/* ── Editable lines ── */
.box-actions { display: inline-flex; align-items: center; gap: 10px; }
.box-edit { font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0; text-transform: none; padding: 5px 12px; min-height: 30px; border-radius: 99px; border: 1px solid currentColor; background: var(--bg-card); color: inherit; cursor: pointer; }
.box-edit.on { background: currentColor; }
.box-shared .box-edit.on { background: var(--blue); color: #fff; border-color: var(--blue); }
.box-personal .box-edit.on { background: var(--green); color: #fff; border-color: var(--green); }
.box-editing { outline: 2px solid currentColor; }
.box-shared.box-editing { outline-color: var(--blue-border); }
.box-personal.box-editing { outline-color: var(--green-border); }
.ln-toggle { border: none; background: none; color: inherit; font-size: 11px; width: 22px; height: 26px; padding: 0; margin: -4px 2px -4px -4px; cursor: pointer; vertical-align: middle; }
.box-shared .ln-toggle { color: var(--blue); } .box-personal .ln-toggle { color: var(--green); }
.ln-count { font-size: 10px; color: var(--text-3); margin-left: 5px; }
.erow.has-subs .ename { font-weight: 600; }
.spin-wrap .spin-val.sum-val { border: none; background: transparent; font-weight: 600; min-width: 96px; }
.box-shared .sum-val { color: var(--blue); } .box-personal .sum-val { color: var(--green); }
.erow.sub .ename { padding-left: 14px; margin-left: 9px; color: var(--text-2); font-size: 12.5px; }
.box-shared .erow.sub .ename { border-left: 2px solid var(--blue-box); }
.box-personal .erow.sub .ename { border-left: 2px solid var(--green-box); }
.edit-list { display: flex; flex-direction: column; gap: 8px; }
.ed-line { background: var(--bg-card); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.box-shared .ed-line { border: 1px solid var(--blue-box); } .box-personal .ed-line { border: 1px solid var(--green-box); }
.ed-row { display: flex; align-items: center; gap: 6px; }
.ed-move { display: flex; flex-direction: column; }
.ed-move button { border: none; background: none; font-size: 11px; width: 28px; height: 22px; color: var(--text-2); cursor: pointer; }
.ed-move button:disabled { opacity: .25; cursor: default; }
.ed-name { flex: 1; min-width: 0; font: inherit; font-size: 14px; border: 1px solid var(--border-2); border-radius: 6px; padding: 9px 10px; background: var(--bg-card); color: var(--text-1); }
.ed-name.ed-sub { font-size: 13px; padding: 8px 10px; }
.ed-btn { flex-shrink: 0; width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--border-2); background: var(--bg-card); color: var(--text-2); font-size: 15px; cursor: pointer; }
.ed-btn.on { border-color: currentColor; }
.ed-btn.ed-add { font-size: 13px; font-weight: 600; }
.box-shared .ed-btn.ed-add { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-box); }
.box-personal .ed-btn.ed-add { color: var(--green); background: var(--green-bg); border-color: var(--green-box); }
.ed-btn.ed-del { color: var(--red); }
.ed-opts { margin-left: 34px; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 13px; background: var(--bg-sub); }
.ed-opts label { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-1); }
.ed-opts select { font: inherit; font-size: 13px; border: 1px solid var(--border-2); border-radius: 6px; padding: 7px 8px; background: var(--bg-card); color: var(--text-1); min-height: 36px; }
.ed-opts input[type="checkbox"] { width: 22px; height: 22px; }
.ed-subs { margin-left: 34px; padding-left: 10px; display: flex; flex-direction: column; gap: 6px; }
.box-shared .ed-subs { border-left: 2px solid var(--blue-box); } .box-personal .ed-subs { border-left: 2px solid var(--green-box); }
.ed-addsub, .ed-addline { font: inherit; font-weight: 600; background: none; border-radius: 8px; cursor: pointer; }
.ed-addsub { align-self: flex-start; font-size: 12px; padding: 8px 12px; min-height: 40px; }
.ed-addline { font-size: 13px; padding: 12px; min-height: 48px; background: var(--bg-card); }
.box-shared .ed-addsub, .box-shared .ed-addline { color: var(--blue); border: 1px dashed var(--blue-border); }
.box-personal .ed-addsub, .box-personal .ed-addline { color: var(--green); border: 1px dashed var(--green-border); }
.ed-hint { font-size: 11px; color: var(--text-2); margin: 0; }
@media (max-width: 580px) {
  .ed-row { gap: 4px; }
  .ed-move button { width: 22px; }
  .ed-btn { width: 38px; height: 40px; font-size: 14px; }
  .ed-opts, .ed-subs { margin-left: 18px; }
  .erow.has-subs .ename { white-space: normal; }
}
.undo-bar { position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 12px); z-index: 1000; display: flex; align-items: center; gap: 16px;
  background: #1a1917; color: #fff; border-radius: 99px; padding: 8px 10px 8px 18px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.undo-bar.show { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.undo-bar button { font: inherit; font-weight: 600; color: #7ec8ff; background: none; border: none; min-height: 36px; padding: 0 8px; cursor: pointer; }
.box-title-note { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: .75; margin-left: 6px; }

.box-chevron {
  font-size: 9px;
  transition: transform 0.2s ease;
  opacity: 0.6;
  flex-shrink: 0;
}
.box-collapsed .box-chevron { transform: rotate(-90deg); }

/* When collapsed: hide rows, remove top border on total */
.box-collapsed .expense-rows  { display: none; }
.box-collapsed .section-total { margin-top: 0; border-top: none; padding-top: 0; }
/* Shared box: rows live in a split-grid (display:grid wins over the rule above) — hide all but the total */
.box-collapsed .expense-rows.split-grid { display: grid; }
.box-collapsed .split-grid > .erow:not(.erow-total) { display: none; }
.box-collapsed .erow-total { margin-top: 0; border-top: none; padding-top: 5px; }

/* Shared account card */
.shared-acc-card {
  border: 1px dashed var(--purple-border);
  border-radius: var(--r-md);
  padding: 0.6rem 1rem;
  margin-bottom: 0.5rem;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  flex-wrap: wrap;
}
.sa-label { flex: 1; font-size: 13px; font-weight: 400; color: var(--text-1); min-width: 80px; }
.sa-note  { font-size: 11px; color: var(--text-3); }

.sa-left .sa-pct { font-size: 11px; font-weight: 400; opacity: .75; margin-left: 6px; }

/* ── Expense rows ── */
.expense-rows { display: flex; flex-direction: column; gap: 1px; }

.erow {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 6px;
  transition: background 0.12s;
}
.erow:hover { background: rgba(0,0,0,0.04); }
@media (prefers-color-scheme: dark) { .erow:hover { background: rgba(255,255,255,0.04); } }

.ename { font-size: 13px; font-weight: 400; color: var(--text-1); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.enote { font-size: 10px; color: var(--text-3); white-space: nowrap; }
/* Phone: notes (weekly / yearly) go under the name so names are not cut */
@media (max-width: 580px) {
  .erow { row-gap: 0; }
  .erow .ename { grid-column: 1; grid-row: 1; }
  .erow .enote { grid-column: 1; grid-row: 2; }
  .erow .enote:empty { display: none; }
  .erow .spin-wrap { grid-column: 3; grid-row: 1 / span 2; }

.eamt  { font-size: 13px; font-weight: 500; color: var(--text-1); text-align: right; min-width: 58px; }
/* Shared box: one grid so header, rows and total share column widths */
.expense-rows.split-grid { display: grid; grid-template-columns: 1fr auto auto auto; column-gap: 8px; }
.split-grid > .erow { grid-column: 1 / -1; grid-template-columns: subgrid; }
.erow-head { padding-top: 0; padding-bottom: 2px; }
.erow-head:hover, .erow-total:hover { background: none !important; }
.erow-head .ch { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--blue); opacity: .7; text-align: center; white-space: nowrap; }
.erow-head .ch:last-child { text-align: right; }
.erow-total { margin-top: 6px; border-top: 1px solid rgba(26,95,168,0.15); border-radius: 0; padding-top: 7px; color: var(--blue); font-size: 13px; font-weight: 500; }
.erow-total .tt { text-align: center; }
.erow-total .eamt { color: var(--blue); }

/* ── Spinners ── */
.spin-wrap { display: flex; align-items: center; }
.spin-wrap button {
  width: 22px; height: 22px;
  border: 1px solid var(--border-2);
  background: var(--bg-card);
  color: var(--text-2);

.spin-val {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-1);

  text-align: center;
  border: 1px solid var(--border-1);
  border-left: none; border-right: none;
  height: 22px;

/* ── Income rows ── */
.income-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 580px) { .income-grid { grid-template-columns: minmax(0,1fr); } .metric.income-total { padding: 0.9rem; } }
.income-grid > * { min-width: 0; }
.income-row {
  display: grid;
  grid-template-columns: 1fr auto auto;

  gap: 8px;
  padding: 5px 8px;
  background: var(--bg-sub);
  border-radius: 6px;
}
.iname { font-size: 13px; font-weight: 400; color: var(--text-1); }

/* ── Partner row ── */
.p-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  border-radius: var(--r-md);
  border: 1px solid var(--border-1);

.plbl { font-size: 13px; font-weight: 400; color: var(--text-2); }

/* ── Donut chart ── */

<script>
'use strict';

// ════════════════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════════════════
const DRIVE_CLIENT_ID = '453884215011-bnuqib76c5lt7vr87g6e5sd59q7r2cip.apps.googleusercontent.com';
const DRIVE_SCOPE     = 'https://www.googleapis.com/auth/drive.file';
const DRIVE_FILENAME  = 'xpenses_calculator_data.json';
const LS_KEY          = 'xpenses_calculator_v1';

// ════════════════════════════════════════════════════════════════════
//  EXPENSE LINES — editable by the owner (✎ Edit on each box)
//  The LAYOUT (names, order, sub-lines, options) is shared by Now and FIRE
//  and saved with the data; AMOUNTS live per tab in states[tab][id].
//
//  line = { id, label, cat, weekly?, yearly?, subs?: [{ id, label }] }
//    cat    — donut category (CATS)
//    weekly — shows "≈ €X/wk" (monthly × 12 / 52), also on its sub-lines
//    yearly — amount is per year (counted / 12)
//    subs   — detail lines: the line's amount is their sum (no stepper on the line)
//  Shared lines (and their sub-lines) are FULL bills paid by both; your half = / 2.
// ════════════════════════════════════════════════════════════════════
const CATS = [
  { id: 'housing',   label: 'Housing',          color: '#3d8fe0' },
  { id: 'utilities', label: 'Utilities',        color: '#4a9fd0' },
  { id: 'pets',      label: 'Pets',             color: '#d08a3a' },
  { id: 'food',      label: 'Food & going out', color: '#c47a00' },
  { id: 'health',    label: 'Health & sport',   color: '#d05830' },
  { id: 'subs',      label: 'Subscriptions',    color: '#c04880' },
  { id: 'savings',   label: 'Savings',          color: '#6a9a20' },
  { id: 'extras',    label: 'Extras',           color: '#909088' },
];
const SECTIONS = ['shared', 'personal'];

// Starting layout = the lines used until Oct 2026 (ids are the old state keys, so amounts carry over)
const DEFAULT_LAYOUT = {
  shared: [
    { id: 'rent',        label: 'Rent',         cat: 'housing' },
    { id: 'internet',    label: 'Free',         cat: 'utilities' },
    { id: 'netflix',     label: 'Netflix',      cat: 'utilities' },
    { id: 'electricity', label: 'Electricity',  cat: 'utilities' },
    { id: 'courses',     label: 'Courses',      cat: 'food', weekly: true },
    { id: 'bobsFood',    label: 'Bobs Food',    cat: 'pets', weekly: true },
    { id: 'bobsLitiere', label: 'Bobs Litière', cat: 'pets', weekly: true },
    { id: 'sharedResto', label: 'Restos',       cat: 'food', weekly: true },
    { id: 'deliveroo',   label: 'Deliveroo',    cat: 'food', weekly: true },
    { id: 'sharedBar',   label: 'Bar / Apéro',  cat: 'food', weekly: true, subs: [
      { id: 'trkBar', label: 'Pola Bar' }, { id: 'trkBarBouffe', label: 'Bar Bouffe' }, { id: 'trkApero', label: 'Apéro' } ] },
    { id: 'sharedExtras', label: 'Extras',      cat: 'extras', subs: [
      { id: 'trkConcert', label: 'Concert' }, { id: 'trkConcertBar', label: 'Concert bar' }, { id: 'trkVacs', label: 'Vacs' }, { id: 'trkHome', label: 'Home' } ] },
  ],
  personal: [
    { id: 'insurance',   label: 'Home insurance', cat: 'utilities' },
    { id: 'lunch',       label: 'Mercado Lunch',  cat: 'food', weekly: true, subs: [
      { id: 'trkSaumon', label: 'Saumon / Poulet' }, { id: 'trkLegumes', label: 'Légumes' } ] },
    { id: 'delivSolo',   label: 'Deliv Solo',     cat: 'food', weekly: true },
    { id: 'extras',      label: 'Extras',         cat: 'extras' },
    { id: 'health',      label: 'Health',         cat: 'health' },
    { id: 'beer',        label: 'Beer',           cat: 'food', weekly: true },
    { id: 'smoothie',    label: 'Post-workout smoothie', cat: 'health', weekly: true, subs: [
      { id: 'trkLait', label: 'Lait' }, { id: 'trkSmoothieNoix', label: 'Smoothie noix' }, { id: 'trkSmoothiePoudre', label: 'Smoothie poudre' } ] },
    { id: 'savings',     label: 'Savings',        cat: 'savings' },
    { id: 'drums',       label: 'Drums',          cat: 'health', weekly: true },
    { id: 'billar',      label: 'Billar membership', cat: 'health', yearly: true },
    { id: 'billarMonth', label: 'Billar monthly', cat: 'health', weekly: true },
    { id: 'chess',       label: 'Chess membership', cat: 'health', yearly: true },
    { id: 'amazonPrime', label: 'Amazon Prime',   cat: 'subs', yearly: true },
    { id: 'phone',       label: 'Phone',          cat: 'subs' },
    { id: 'claude',      label: 'Claude',         cat: 'subs' },
  ],
};
// Old Breakdown rows (your part) that became sub-lines of a SHARED line: their amounts double (full bill)
const OLD_SHARED_SUB_IDS = ['trkBar', 'trkBarBouffe', 'trkApero', 'trkConcert', 'trkConcertBar', 'trkVacs', 'trkHome'];

let layout = JSON.parse(JSON.stringify(DEFAULT_LAYOUT));

// ════════════════════════════════════════════════════════════════════
//  DEFAULT STATE — amounts per tab (income, Revolut, every line / sub-line id)
// ════════════════════════════════════════════════════════════════════
const DEFAULTS = {
  now: {
    salary: 2000, tickets: 200, mel: 40,
    rent: 1450, insurance: 25, internet: 40, netflix: 15, electricity: 120,
    bobsFood: 20, bobsLitiere: 50, courses: 200, sharedResto: 200, deliveroo: 100,
    sharedAcc: 600,
    phone: 10, claude: 20, amazonPrime: 69, beer: 30, chess: 90,
    billar: 150, billarMonth: 10, delivSolo: 50, extras: 100,
    health: 120, drums: 10, savings: 50,
    trkSaumon: 20, trkLegumes: 10, trkLait: 10, trkSmoothieNoix: 20, trkSmoothiePoudre: 30,
    trkBar: 60, trkBarBouffe: 60, trkApero: 100, trkConcert: 100, trkConcertBar: 60, trkVacs: 400, trkHome: 100,
  },
  fire: {
    salary: 0, tickets: 500, mel: 40,
    rent: 900, insurance: 20, internet: 40, netflix: 15, electricity: 80,
    bobsFood: 20, bobsLitiere: 50, courses: 200, sharedResto: 200, deliveroo: 100,
    sharedAcc: 400,
    phone: 10, claude: 20, amazonPrime: 69, beer: 30, chess: 90,
    billar: 150, billarMonth: 10, delivSolo: 50, extras: 150,
    health: 120, drums: 10, savings: 0,
    trkSaumon: 20, trkLegumes: 10, trkLait: 10, trkSmoothieNoix: 20, trkSmoothiePoudre: 30,
    trkBar: 60, trkBarBouffe: 60, trkApero: 100, trkConcert: 100, trkConcertBar: 60, trkVacs: 400, trkHome: 100,
  },
};

// ════════════════════════════════════════════════════════════════════
//  RUNTIME STATE
// ════════════════════════════════════════════════════════════════════
let states = JSON.parse(JSON.stringify(DEFAULTS));
const charts = { now: null, fire: null };
const editing = { shared: false, personal: false };   // edit mode per box (both tabs)
let optsOpen = null;                                   // line id whose options panel is open
let openLines = new Set();                             // expanded lines (this device only)
try { openLines = new Set(JSON.parse(localStorage.getItem('xpenses_open_lines') || '[]')); } catch (_) {}

// ════════════════════════════════════════════════════════════════════
//  FORMATTERS
// ════════════════════════════════════════════════════════════════════
const fmt      = n => '€' + Math.round(n).toLocaleString('de-DE');
const fmtd     = n => '€' + n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtSmart = n => (n % 1 === 0) ? fmt(n) : fmtd(n);
// Weekly equivalent of a monthly amount (a month is 52/12 ≈ 4,33 weeks)
const weekly   = m => m * 12 / 52;
const fmtWeek  = m => { const w = weekly(m); return '≈ €' + w.toLocaleString('de-DE', { maximumFractionDigits: w < 10 ? 1 : 0 }) + '/wk'; };
const esc      = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ════════════════════════════════════════════════════════════════════
//  DERIVED VALUES
// ════════════════════════════════════════════════════════════════════
const hasSubs     = line => Array.isArray(line.subs) && line.subs.length > 0;
const lineAmount  = (s, line) => hasSubs(line) ? line.subs.reduce((t, x) => t + (s[x.id] || 0), 0) : (s[line.id] || 0);
const lineMonthly = (s, line) => lineAmount(s, line) / (line.yearly ? 12 : 1);
// Stepper increment from the amount (no per-line setting): 1 under €30, 5 under €150, 10 above
const stepFor = (v, dir) => { const x = dir > 0 ? v : v - 1; return x < 30 ? 1 : x < 150 ? 5 : 10; };

function derived(s) {
  const sharedTotal     = layout.shared.reduce((t, l) => t + lineMonthly(s, l), 0);
  const personalMonthly = layout.personal.reduce((t, l) => t + lineMonthly(s, l), 0);
  // Joint Revolut pot: both put in sharedAcc; shared bills are paid from it.
  const sharedPool = s.sharedAcc * 2;
  const sharedLeft = sharedPool - sharedTotal;
  // Real cost of living: your half of what the shared account actually pays + personal.
  // Unspent Revolut money is still yours, so it is not counted as an expense.
  const gross    = sharedTotal / 2 + personalMonthly;
  const net      = gross; // partner's monthly contribution is already in income (Mel)
  const income   = s.salary + s.tickets + s.mel;
  const leftover = income - net;
  return { sharedTotal, sharedPool, sharedLeft, personalMonthly, gross, net, income, leftover };
}
// Donut: your monthly cost per category (your half of shared lines) — sums to derived().gross
function donutCats(s) {
  const catOf = l => CATS.some(k => k.id === l.cat) ? l.cat : 'extras';
  return CATS.map(c => ({ ...c, value:
    layout.shared.filter(l => catOf(l) === c.id).reduce((t, l) => t + lineMonthly(s, l) / 2, 0) +
    layout.personal.filter(l => catOf(l) === c.id).reduce((t, l) => t + lineMonthly(s, l), 0) }));
}

// ════════════════════════════════════════════════════════════════════
//  LAYOUT VALIDATION & MIGRATION
// ════════════════════════════════════════════════════════════════════
function validLayout(l) {
  const ok = arr => Array.isArray(arr) && arr.every(x => x && typeof x.id === 'string' && typeof x.label === 'string' &&
    (x.subs === undefined || (Array.isArray(x.subs) && x.subs.every(y => y && typeof y.id === 'string' && typeof y.label === 'string'))));
  return !!l && ok(l.shared) && ok(l.personal);
}
// Apply a saved payload { now, fire, layout? }. Saves from before editable lines (no layout) used a
// Breakdown in "your part": its rows that are now sub-lines of a Shared line are doubled (full bill).
function applySaved(saved) {
  if (!saved || !saved.now || !saved.fire) return false;
  const old = !validLayout(saved.layout);
  ['now', 'fire'].forEach(tab => {
    const src = { ...saved[tab] };
    if (old) OLD_SHARED_SUB_IDS.forEach(k => { if (typeof src[k] === 'number') src[k] *= 2; });
    states[tab] = { ...DEFAULTS[tab], ...src };
  });
  layout = old ? JSON.parse(JSON.stringify(DEFAULT_LAYOUT)) : saved.layout;
  return true;
}

// ════════════════════════════════════════════════════════════════════
//  LOCAL STORAGE
// ════════════════════════════════════════════════════════════════════
function saveLocal(tab) {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ ...states, layout }));
    showToast(tab === 'now' ? 'Now · saved' : tab === 'fire' ? 'FIRE · saved' : 'Saved');
    cloudSave();
  } catch (_) {}
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) applySaved(JSON.parse(raw));
  } catch (_) {}
}

// ════════════════════════════════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════════════════════════════════
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ════════════════════════════════════════════════════════════════════
//  CLOUDFLARE WORKERS AUTO-SYNC
// ════════════════════════════════════════════════════════════════════
const CLOUD = LifeSync.cloud('xpenses-calculator');

function cfSetStatus(ok) {
  const wrap = document.getElementById('cf-status');
  const text = document.getElementById('cf-status-text');
  const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  wrap.className = 'cf-status ' + (ok ? 'ok' : 'err');
  text.textContent = ok ? 'Synced at ' + time : 'Sync failed at ' + time;
}

// Small summary for the Life Hub tile (both tabs, so it is the same on every device)
function hubSummary() {
  const hub = {};
  ['now', 'fire'].forEach(tab => {
    const d = derived(states[tab]);
    hub[tab] = { leftover: Math.round(d.leftover), net: Math.round(d.net), income: Math.round(d.income) };
  });
  return hub;
}

let cfSaveTimer = null;
function cloudPayload() { return { savedAt: new Date().toISOString(), ...states, layout, hub: hubSummary() }; }
async function cloudSave() {
  clearTimeout(cfSaveTimer);
  CLOUD.stage(cloudPayload());   // kept as pending now, so leaving before the upload loses nothing
  cfSaveTimer = setTimeout(cloudPush, 3000);
}
async function cloudPush() {
  cfSaveTimer = null;
  try {
    await CLOUD.put(cloudPayload());
    cfSetStatus(true);
  } catch (e) {
    cfSetStatus(false);
    console.warn('Cloud save failed', e);
  }
}
// Leaving the page (Hub link, app switch): send a waiting save now instead of losing it
LifeSync.onLeave(() => { if (cfSaveTimer) { clearTimeout(cfSaveTimer); cloudPush(); } });

async function cloudLoad() {
  try {
    const data = await CLOUD.get();
    if (applySaved(data)) {
      saveLocal(null);
      render('now');
      render('fire');
      cfSetStatus(true);
    }
  } catch (e) {
    cfSetStatus(false);
    console.warn('Cloud load failed', e);
  }
}

let driveStatusTimer = null;
function driveSetStatus(msg, cls) {
  const el = document.getElementById('drive-status');
  el.textContent = msg;
  el.className = 'drive-status visible' + (cls ? ' ' + cls : '');
  clearTimeout(driveStatusTimer);
  driveStatusTimer = setTimeout(() => {
    el.classList.remove('visible');
  }, 4000);
}

function driveSetBusy(busy) {
  document.getElementById('btn-drive-save').disabled = busy;
  document.getElementById('btn-drive-load').disabled = busy;
}



// Google Drive backup — shared logic in lib/drive.js
const DRIVE = LifeDrive.create({
  filename: DRIVE_FILENAME,
  status: driveSetStatus,
  busy: driveSetBusy,
  payload: () => ({ ...states, layout }),
  apply: saved => {
      if (!applySaved(saved)) throw new Error('invalid');
      saveLocal(null);
      render('now');
      render('fire');
    },
});
function driveSave() { DRIVE.save(); }

function driveLoad() { DRIVE.load(); }

//  SPINNER FACTORY
// ════════════════════════════════════════════════════════════════════
function makeSpin(containerId, tab, key, step, min = 0) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = `<button>−</button><div class="spin-val" id="${tab}-sv-${key}"></div><button>+</button>`;
  el.children[0].onclick = () => { states[tab][key] = Math.max(min, states[tab][key] - step); render(tab); saveLocal(tab); };
  el.children[2].onclick = () => { states[tab][key] = Math.max(min, states[tab][key] + step); render(tab); saveLocal(tab); };
}

function render(tab) {
  const s = states[tab];
  const d = derived(s);
  renderSection(tab, 'shared');
  renderSection(tab, 'personal');
  const p = tab + '-';

  document.getElementById(`${p}sv-salary`).textContent   = fmt(s.salary);
  document.getElementById(`${p}amt-salary`).textContent  = fmt(s.salary);
  document.getElementById(`${p}sv-tickets`).textContent  = fmt(s.tickets);
  document.getElementById(`${p}amt-tickets`).textContent = fmt(s.tickets);
  document.getElementById(`${p}sv-mel`).textContent      = fmt(s.mel);
  document.getElementById(`${p}amt-mel`).textContent     = fmt(s.mel);
  document.getElementById(`${p}m-income`).textContent    = fmt(d.income);

  document.getElementById(`${p}m-gross`).textContent      = fmt(d.gross);
  document.getElementById(`${p}m-shared-acc`).textContent = fmt(s.sharedAcc);
  document.getElementById(`${p}m-leftover`).textContent   = fmt(d.leftover);
  document.getElementById(`${p}leftover-card`).className  = d.leftover >= 0 ? 'metric c-purple' : 'metric c-red';
  document.getElementById(`${p}m-year`).textContent       = fmt(d.leftover * 12);
  document.getElementById(`${p}year-card`).className      = d.leftover >= 0 ? 'metric c-green' : 'metric c-red';

  // Write computed outputs so the Life Hub can read them directly
  try {
    const outputs = JSON.parse(localStorage.getItem('xpenses_calculator_outputs') || '{}');
    outputs[tab] = { leftover: Math.round(d.leftover), net: Math.round(d.net), income: Math.round(d.income) };
    outputs.savedAt = new Date().toISOString();
    localStorage.setItem('xpenses_calculator_outputs', JSON.stringify(outputs));
  } catch (_) {}
  if (!editing.shared) {
    document.getElementById(`${p}total-shared`).textContent = fmt(d.sharedTotal);
    document.getElementById(`${p}half-shared`).textContent  = fmtSmart(d.sharedTotal / 2);
  }
  document.getElementById(`${p}sa-left`).textContent       = (d.sharedLeft < 0 ? '−' : '') + fmt(Math.abs(d.sharedLeft));
  document.getElementById(`${p}sa-left-pct`).textContent   = d.sharedPool > 0 ? (d.sharedLeft >= 0 ? `${Math.round(d.sharedLeft / d.sharedPool * 100)}% of ${fmt(d.sharedPool)}` : `over ${fmt(d.sharedPool)} · you top up ${fmt(-d.sharedLeft / 2)}`) : '';
  document.getElementById(`${p}sa-left-row`).classList.toggle('pos', d.sharedLeft >= 0);
  document.getElementById(`${p}sa-left-row`).classList.toggle('neg', d.sharedLeft < 0);

  document.getElementById(`${p}sv-sharedAcc`).textContent  = fmt(s.sharedAcc);
  document.getElementById(`${p}sa-note`).textContent       = `each puts in €${s.sharedAcc}`;
  document.getElementById(`${p}sa-total`).textContent      = fmt(d.sharedPool);

  document.getElementById(`${p}total-personal`).textContent = fmt(d.personalMonthly);

  const cats      = donutCats(s);
  const isDark    = window.matchMedia('(prefers-color-scheme:dark)').matches;
  const borderCol = isDark ? '#1e1d1b' : '#ffffff';

  if (!charts[tab]) {
    charts[tab] = new Chart(document.getElementById(`${tab}-pie-chart`), {
      type: 'doughnut',
      data: {
        labels:   cats.map(c => c.label),
        datasets: [{ data: cats.map(c => c.value), backgroundColor: cats.map(c => c.color), borderWidth: 2, borderColor: borderCol }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        cutout: '58%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: ctx => {
            const tot = ctx.dataset.data.reduce((a, b) => a + b, 0);
            return ` €${Math.round(ctx.parsed)} — ${Math.round(ctx.parsed / tot * 100)}%`;
          }}},
        },
      },
    });
  } else {
    charts[tab].data.datasets[0].data = cats.map(c => c.value);
    charts[tab].update('none');
  }

  document.getElementById(`${tab}-chart-legend`).innerHTML = cats.map(c =>
    `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--text-2);margin-right:10px">
      <span style="width:9px;height:9px;border-radius:2px;background:${c.color};flex-shrink:0"></span>${c.label}
    </span>`
  ).join('');
}

//  EXPENSE SECTIONS — normal view (steppers, ▸/▾ sub-lines) and edit mode

const SEC_NAME = { shared: 'Shared', personal: 'Personal' };

function stepperHTML(tab, id, value) {
  return `<div class="spin-wrap" id="${tab}-spin-${id}"><button data-act="dec" data-id="${id}" aria-label="Minus">−</button>` +
         `<div class="spin-val" id="${tab}-sv-${id}">${fmt(value)}</div><button data-act="inc" data-id="${id}" aria-label="Plus">+</button></div>`;
}

function linesHTML(tab, sec) {
  const s = states[tab];
  return layout[sec].map(line => {
    const raw = lineAmount(s, line), monthly = raw / (line.yearly ? 12 : 1), subs = hasSubs(line), open = subs && openLines.has(line.id);
    const note = line.yearly ? `€${fmt(raw).slice(1)}/yr → €${(raw / 12).toFixed(2).replace('.', ',')}/mo` : line.weekly ? fmtWeek(monthly) : '';
    const amt  = sec === 'shared' ? fmtSmart(monthly / 2) : fmtSmart(monthly);
    let h = `<div class="erow${subs ? ' has-subs' : ''}" data-line="${line.id}">
      <span class="ename">${subs ? `<button class="ln-toggle" data-act="toggle" data-id="${line.id}" aria-label="${open ? 'Collapse' : 'Expand'} ${esc(line.label)}">${open ? '▾' : '▸'}</button>` : ''}${esc(line.label)}${subs ? `<span class="ln-count">· ${line.subs.length}</span>` : ''}</span>
      <span class="enote" id="${tab}-note-${line.id}">${note}</span>
      ${subs ? `<div class="spin-wrap"><div class="spin-val sum-val" id="${tab}-sv-${line.id}">${fmt(raw)}</div></div>` : stepperHTML(tab, line.id, raw)}
      <span class="eamt" id="${tab}-amt-${line.id}">${amt}</span>
    </div>`;
    if (open) line.subs.forEach(x => {
      const v = s[x.id] || 0;
      h += `<div class="erow sub">
        <span class="ename">${esc(x.label)}</span>
        <span class="enote" id="${tab}-note-${x.id}">${line.weekly && !line.yearly ? fmtWeek(v) : ''}</span>
        ${stepperHTML(tab, x.id, v)}
        <span class="eamt"></span>
      </div>`;
    });
    return h;
  }).join('');
}

function editHTML(sec) {
  const n = layout[sec].length;
  const btn = (act, attrs, label, txt, cls = '') => `<button class="ed-btn ${cls}" data-act="${act}" ${attrs} aria-label="${label}">${txt}</button>`;
  return `<div class="edit-list">` + layout[sec].map((line, i) => {
    const a = `data-sec="${sec}" data-id="${line.id}"`;
    let h = `<div class="ed-line">
      <div class="ed-row">
        <div class="ed-move">
          <button data-act="up" ${a} aria-label="Move ${esc(line.label)} up"${i === 0 ? ' disabled' : ''}>▲</button>
          <button data-act="down" ${a} aria-label="Move ${esc(line.label)} down"${i === n - 1 ? ' disabled' : ''}>▼</button>
        </div>
        <input class="ed-name" data-act="rename" ${a} value="${esc(line.label)}" aria-label="Line name">
        ${btn('addsub', a, 'Add sub-line to ' + esc(line.label), '＋↳', 'ed-add')}
        ${btn('opts', a, 'Options for ' + esc(line.label), '⋯', optsOpen === line.id ? 'on' : '')}
        ${btn('del', a, 'Delete ' + esc(line.label), '🗑', 'ed-del')}
      </div>`;
    if (optsOpen === line.id) h += `<div class="ed-opts">
        <label><span>Donut category</span><select data-act="cat" ${a}>${CATS.map(c => `<option value="${c.id}"${c.id === line.cat ? ' selected' : ''}>${esc(c.label)}</option>`).join('')}</select></label>
        <label><span>Show ≈ per week</span><input type="checkbox" data-act="weekly" ${a}${line.weekly ? ' checked' : ''}></label>
        <label><span>Amount is yearly (/12)</span><input type="checkbox" data-act="yearly" ${a}${line.yearly ? ' checked' : ''}></label>
      </div>`;
    if (hasSubs(line)) h += `<div class="ed-subs">` + line.subs.map(x => `<div class="ed-row">
        <input class="ed-name ed-sub" data-act="renamesub" ${a} data-sub="${x.id}" value="${esc(x.label)}" aria-label="Sub-line name">
        ${btn('delsub', `${a} data-sub="${x.id}"`, 'Delete ' + esc(x.label), '🗑', 'ed-del')}
      </div>`).join('') + `<button class="ed-addsub" data-act="addsub" ${a}>＋ Add sub-line</button></div>`;
    return h + `</div>`;
  }).join('') + `<button class="ed-addline" data-act="addline" data-sec="${sec}">＋ Add line to ${SEC_NAME[sec]}</button>
    <p class="ed-hint">Amounts are set with the steppers outside edit mode. Changes apply to Now and FIRE.</p></div>`;
}

function renderSection(tab, sec) {
  const body = document.getElementById(`${tab}-${sec}-body`);
  const btn  = document.getElementById(`${tab}-${sec}-edit`);
  btn.textContent = editing[sec] ? 'Done' : '✎ Edit';
  btn.classList.toggle('on', editing[sec]);
  document.getElementById(`${tab}-box-${sec}`).classList.toggle('box-editing', editing[sec]);
  if (editing[sec]) { body.innerHTML = editHTML(sec); return; }
  body.innerHTML = sec === 'shared'
    ? `<div class="expense-rows split-grid">
        <div class="erow erow-head"><span></span><span></span><span class="ch">Paid by both</span><span class="ch">Your half</span></div>
        ${linesHTML(tab, sec)}
        <div class="erow erow-total"><span>Total</span><span></span><span class="tt" id="${tab}-total-shared">—</span><span class="eamt" id="${tab}-half-shared">—</span></div>
      </div>`
    : `<div class="expense-rows">${linesHTML(tab, sec)}</div>`;
}

// ── Layout edits (both tabs share the layout) ──
const findLine = (sec, id) => layout[sec].find(l => l.id === id);
const newId = () => 'l' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let undoItem = null, undoTimer = null;
function offerUndo(msg, restore) {
  undoItem = restore;
  document.getElementById('undo-msg').textContent = msg;
  document.getElementById('undo-bar').classList.add('show');
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { document.getElementById('undo-bar').classList.remove('show'); undoItem = null; }, 6000);
}
function layoutChanged(focusSel) {
  saveLocal(null);
  ['now', 'fire'].forEach(render);
  if (focusSel) setTimeout(() => { const el = document.querySelector(`.tab-pane.active ${focusSel}`); if (el) { el.focus(); el.select(); } }, 0);
}
function saveOpen() { try { localStorage.setItem('xpenses_open_lines', JSON.stringify([...openLines])); } catch (_) {} }

function onSectionClick(tab, ev) {
  const b = ev.target.closest('[data-act]');
  if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  const act = b.dataset.act, id = b.dataset.id, sec = b.dataset.sec;
  if (act === 'inc' || act === 'dec') {
    const s = states[tab], v = s[id] || 0, dir = act === 'inc' ? 1 : -1;
    s[id] = Math.max(0, v + dir * stepFor(v, dir));
    render(tab); saveLocal(tab); return;
  }
  if (act === 'toggle') { openLines.has(id) ? openLines.delete(id) : openLines.add(id); saveOpen(); render(tab); return; }
  if (act === 'edit') { editing[sec] = !editing[sec]; optsOpen = null; document.getElementById(`${tab}-box-${sec}`).classList.remove('box-collapsed'); ['now', 'fire'].forEach(render); return; }
  if (act === 'opts') { optsOpen = optsOpen === id ? null : id; ['now', 'fire'].forEach(render); return; }
  const list = layout[sec];
  const i = list.findIndex(l => l.id === id), line = list[i];
  if (act === 'up' || act === 'down') {
    const j = act === 'up' ? i - 1 : i + 1; if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; layoutChanged(); return;
  }
  if (act === 'del') {
    list.splice(i, 1);
    layoutChanged();
    offerUndo(`“${line.label}” deleted`, () => { list.splice(Math.min(i, list.length), 0, line); layoutChanged(); });
    return;
  }
  if (act === 'addsub') {
    const sid = newId();
    if (!hasSubs(line)) {   // first detail line keeps the line's current amount, so the total does not change
      line.subs = [{ id: sid, label: line.label }];
      ['now', 'fire'].forEach(t => { states[t][sid] = states[t][line.id] || 0; });
    } else {
      line.subs.push({ id: sid, label: 'New item' });
      ['now', 'fire'].forEach(t => { states[t][sid] = 0; });
    }
    openLines.add(line.id); saveOpen();
    layoutChanged(`[data-sub="${sid}"]`); return;
  }
  if (act === 'delsub') {
    const k = line.subs.findIndex(x => x.id === b.dataset.sub), sub = line.subs[k];
    line.subs.splice(k, 1);
    if (!line.subs.length) delete line.subs;
    layoutChanged();
    offerUndo(`“${sub.label}” deleted`, () => { line.subs = line.subs || []; line.subs.splice(Math.min(k, line.subs.length), 0, sub); layoutChanged(); });
    return;
  }
  if (act === 'addline') {
    const nid = newId();
    layout[sec].push({ id: nid, label: 'New line', cat: 'extras' });
    ['now', 'fire'].forEach(t => { states[t][nid] = 0; });
    layoutChanged(`[data-act="rename"][data-id="${nid}"]`); return;
  }
}
function onSectionChange(ev) {
  const el = ev.target, act = el.dataset.act; if (!act) return;
  const line = findLine(el.dataset.sec, el.dataset.id); if (!line) return;
  if (act === 'rename' || act === 'renamesub') {   // no re-render, so focus can move to the next field
    const v = el.value.trim(), x = act === 'rename' ? line : line.subs.find(y => y.id === el.dataset.sub);
    if (x && v) x.label = v; else el.value = x ? x.label : el.value;
    saveLocal(null); return;
  }
  if (act === 'cat')       line.cat = el.value;
  if (act === 'weekly')    { if (el.checked) line.weekly = true; else delete line.weekly; }
  if (act === 'yearly')    { if (el.checked) line.yearly = true; else delete line.yearly; }
  layoutChanged();
}
document.getElementById('undo-btn').addEventListener('click', () => {
  const f = undoItem; undoItem = null; document.getElementById('undo-bar').classList.remove('show'); if (f) f();
});

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b  => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === `pane-${tab}`));
  render(tab);
}
