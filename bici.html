<!DOCTYPE html>
<html lang="en">
<head>
<script src="lib/pwa.js"></script>
<script src="lib/sync-auth.js"></script>
<script src="lib/sync.js"></script>
<script src="lib/drive.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bici</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eeede9; --card: #ffffff; --sub: #f5f5f3;
  --text: #1a1a18; --text2: #5f5e5a; --text3: #8a8880;
  --border: rgba(0,0,0,0.11); --border2: rgba(0,0,0,0.2);
  --teal: #0f8a7a; --teal-bg: #def5f0; --teal-tx: #0a5f54; --on-teal: #ffffff;
  --route: #e8590c; --heat0: #e6e5e0; --heat1: #8fd8cb; --heat2: #0f8a7a;
  --danger: #c43c3c; --amber-bg: #fdf1e0; --amber-tx: #7a4300;
  --font: 'DM Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #1f1f1d; --sub: #2a2a28;
    --text: #f0ede6; --text2: #a8a69f; --text3: #7a7872;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.18);
    --teal: #3cc4b0; --teal-bg: #12302b; --teal-tx: #9be6da; --on-teal: #0b1f1c;
    --route: #ff8a3d; --heat0: #2e2e2b; --heat1: #1f6b5f; --heat2: #3cc4b0;
    --danger: #e06666; --amber-bg: #2b1f0c; --amber-tx: #f5c27a;
  }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
  .leaflet-container { background: #2a2a28; }
}
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }

/* Header (same pattern as the other widgets) */
.site-header { position: sticky; top: 0; z-index: 1100; background: var(--card); border-bottom: 1px solid var(--border); }
.header-row { max-width: 1400px; margin: 0 auto; height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; }
#home-link { display: flex; align-items: center; opacity: 0.85; text-decoration: none; }
#home-link:hover { opacity: 1; }
.header-sep { width: 1px; height: 26px; background: var(--border); }
.logo { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.logo-main { font-size: 24px; font-weight: 700; letter-spacing: 0.01em; color: var(--teal); line-height: 1; white-space: nowrap; }
@media (max-width: 520px) { .logo-sub { display: none; } }
.logo-sub { font-size: 12px; letter-spacing: 0.16em; color: var(--text2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#drivesavebtn, #driveloadbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: 99px; border: none; background: rgba(26,115,232,0.14); color: #1a73e8; white-space: nowrap; }
#drivesavebtn:disabled, #driveloadbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.status-bar { max-width: 1400px; margin: 0 auto; padding: 0 16px 4px; display: flex; gap: 14px; justify-content: center; font-size: 11px; color: var(--text3); min-height: 16px; }
#drive-status { display: none; }
#drive-status.visible { display: block; }
#drive-status.ok { color: var(--teal); } #drive-status.err { color: var(--danger); } #drive-status.working { color: #b25f00; }
#cf-status { display: flex; align-items: center; gap: 5px; }
#cf-status .cf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
#cf-status.ok { color: var(--teal); } #cf-status.ok .cf-dot { background: var(--teal); }
#cf-status.err { color: var(--danger); } #cf-status.err .cf-dot { background: var(--danger); }

/* Layout: map + side panel (side by side from 900 px, stacked below) */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 73px); height: calc(100dvh - 73px); }
.map-wrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--sub); }
.side { min-height: 0; overflow-y: auto; padding: 12px 14px 24px; border-left: 1px solid var(--border); background: var(--bg); }
@media (max-width: 899px) {
  .layout { display: block; height: auto; }
  .map-wrap { height: 56vh; height: 56dvh; }
  .side { border-left: none; overflow: visible; }
}
.map-tools { position: absolute; top: 10px; right: 10px; z-index: 900; display: flex; flex-direction: column; gap: 6px; }
.map-tools button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border2); background: var(--card); font-size: 17px; display: flex; align-items: center; justify-content: center; }
.map-tools button.on { background: var(--teal-bg); border-color: var(--teal); }
.map-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 900; background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 8px 10px; display: none; align-items: center; gap: 8px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
.map-hint.visible { display: flex; }
.map-hint button { border: 1px solid var(--border2); background: var(--sub); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.map-hint button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.no-map { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--text2); font-size: 14px; }

/* Side panel */
.actions { display: flex; gap: 8px; margin-bottom: 12px; }
.actions button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--border2); background: var(--card); font-size: 13px; font-weight: 500; padding: 0 6px; white-space: nowrap; }
.actions button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin: 14px 0 8px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px 10px; min-width: 0; }
.stat-l { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-v { font-size: 19px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.stat-s { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 899px) and (min-width: 600px) { .stats { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 2px; justify-content: start; }
.heat i { width: 11px; height: 11px; border-radius: 2px; background: var(--heat0); display: block; }
.heat i.l1 { background: var(--heat1); } .heat i.l2 { background: var(--heat2); } .heat i.out { visibility: hidden; }
.heat-foot { font-size: 11px; color: var(--text3); margin-top: 4px; }
.rides { display: flex; flex-direction: column; gap: 6px; }
.ride { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; }
.ride.sel { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.ride-date { flex: none; width: 44px; text-align: center; line-height: 1.1; }
.ride-date b { display: block; font-size: 18px; }
.ride-date span { font-size: 11px; color: var(--text2); text-transform: uppercase; }
.ride-main { flex: 1; min-width: 0; }
.ride-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride-meta { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; font-size: 11px; font-weight: 700; color: var(--teal-tx); background: var(--teal-bg); border-radius: 99px; padding: 3px 8px; }
.badge.amber { color: var(--amber-tx); background: var(--amber-bg); }
.ride.plan { border-style: dashed; border-color: var(--teal); }
.ride.plan.sel { border-style: solid; }
.cps { display: flex; flex-direction: column; gap: 6px; }
.cp { display: flex; gap: 10px; align-items: flex-start; background: var(--sub); border-radius: 10px; padding: 8px 10px; }
.cp-n { flex: none; width: 26px; height: 26px; border-radius: 50%; border: none; background: var(--teal); color: var(--on-teal); font-size: 12px; font-weight: 700; }
.cp.done .cp-n { background: var(--text3); }
.cp-main { flex: 1; min-width: 0; }
.cp-name { font-weight: 500; font-size: 14px; }
.cp.done .cp-name { text-decoration: line-through; color: var(--text2); }
.cp-what { font-size: 13px; color: var(--text2); margin-top: 2px; line-height: 1.35; }
.cp-fact { font-size: 12px; color: var(--text3); font-style: italic; margin-top: 2px; line-height: 1.35; }
.cp-check { flex: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2); background: var(--card); font-size: 16px; }
.cp.done .cp-check { background: var(--teal-bg); border-color: var(--teal); color: var(--teal-tx); }
.cp-empty { font-size: 13px; color: var(--text2); line-height: 1.45; }
.paste { display: flex; flex-direction: column; gap: 6px; }
.paste textarea { width: 100%; min-height: 110px; border: 1px solid var(--border2); background: var(--sub); border-radius: 10px; padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 12px; }
.paste-err { color: var(--danger); font-size: 13px; min-height: 0; }
.paste button, .sheet-actions button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.paste button { border: 1px solid var(--teal); border-radius: 10px; padding: 8px 12px; font-size: 13px; align-self: flex-start; }
.cp-pin { width: 26px; height: 26px; border-radius: 50%; background: #0f8a7a; color: #fff; border: 2px solid #fff; font: 700 12px/22px 'DM Sans', system-ui, sans-serif; text-align: center; box-shadow: 0 1px 5px rgba(0,0,0,0.45); }
.cp-pin.done { background: #8a8880; }
.empty { background: var(--card); border: 1px dashed var(--border2); border-radius: 12px; padding: 14px; font-size: 13px; color: var(--text2); line-height: 1.5; }

/* Ride editor: drawer over the side panel (wide) or bottom sheet (narrow) */
.sheet { position: fixed; z-index: 1200; background: var(--card); border: 1px solid var(--border2); box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; }
.sheet.open { display: flex; }
@media (min-width: 900px) { .sheet { top: 73px; right: 0; bottom: 0; width: 380px; border-radius: 0; border-top: none; border-right: none; border-bottom: none; } }
@media (max-width: 899px) { .sheet { left: 0; right: 0; bottom: 0; max-height: 78vh; max-height: 78dvh; border-radius: 16px 16px 0 0; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.sheet-head .t { flex: 1; font-weight: 700; font-size: 15px; }
.sheet-head button { border: none; background: var(--teal); color: var(--on-teal); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.sheet-body { overflow-y: auto; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--border2); background: var(--sub); border-radius: 10px; padding: 9px 10px; font-size: 15px; }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.row3 input { min-width: 0; padding: 9px 6px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border2); background: var(--sub); border-radius: 99px; padding: 6px 10px; font-size: 13px; }
.chip.on { background: var(--teal-bg); border-color: var(--teal); color: var(--teal-tx); font-weight: 500; }
.ride-info { font-size: 13px; color: var(--text2); background: var(--sub); border-radius: 10px; padding: 8px 10px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-actions button { border: 1px solid var(--border2); background: var(--sub); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.sheet-actions button.del { color: var(--danger); margin-left: auto; }
.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 1300; background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13px; max-width: calc(100% - 24px); display: none; }
.toast.visible { display: block; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a id="home-link" href="index.html" title="Back to Life Hub">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="13.5" stroke="url(#hl-g1)" stroke-width="1.2" fill="none" opacity="0.7"/>
        <ellipse cx="16" cy="16" rx="13.5" ry="5.5" stroke="url(#hl-g2)" stroke-width="1" fill="none" opacity="0.55" transform="rotate(-35 16 16)"/>
        <ellipse cx="16" cy="16" rx="13.5" ry="5.5" stroke="url(#hl-g3)" stroke-width="1" fill="none" opacity="0.45" transform="rotate(35 16 16)"/>
        <circle cx="16" cy="16" r="2.5" fill="url(#hl-g4)"/>
        <circle cx="16" cy="2.5" r="1.5" fill="white" opacity="0.9"/>
        <defs>
          <linearGradient id="hl-g1" x1="2.5" y1="2.5" x2="29.5" y2="29.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7dd3fc"/>
          </linearGradient>
          <linearGradient id="hl-g2" x1="2.5" y1="2.5" x2="29.5" y2="29.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#00e5a0"/>
          </linearGradient>
          <linearGradient id="hl-g3" x1="2.5" y1="29.5" x2="29.5" y2="2.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
          <radialGradient id="hl-g4" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#a78bfa"/>
          </radialGradient>
        </defs>
      </svg>
    </a>
    <div class="header-sep"></div>
    <div class="logo"><span class="logo-main"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--route)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px;margin-right:4px"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 9 9h7l2.5 7M9 9l3 7h-6.5M16 9l-4 7M7.5 7h3M16 9l-1-3h2.5"/></svg>Bici</span><span class="logo-sub">Rides &amp; exploration</span></div>
    <button id="drivesavebtn" title="Save to Google Drive">☁ Save</button>
    <button id="driveloadbtn" title="Load from Google Drive">☁ Load</button>
  </div>
  <div class="status-bar">
    <span id="cf-status"><span class="cf-dot"></span><span id="cf-status-msg"></span></span>
    <span id="drive-status"></span>
  </div>
</header>

<main class="layout">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <button id="btn-fog" class="on" title="Show / hide the fog">🌫</button>
      <button id="btn-home" title="Set home: then tap the map">⌂</button>
      <button id="btn-locate" title="Where am I">◎</button>
      <button id="btn-fit" title="Show all rides">⤢</button>
    </div>
    <div class="map-hint" id="map-hint"></div>
  </div>

  <aside class="side">
    <div class="actions">
      <button class="primary" id="btn-import">⬆ Ride GPX</button>
      <button id="btn-plan">🗺 Plan GPX</button>
      <button id="btn-draw">✎ Draw</button>
    </div>
    <input type="file" id="gpx-input" multiple hidden>
    <input type="file" id="plan-input" multiple hidden>

    <div id="plans-sec" hidden>
      <div class="sec-title">Planned</div>
      <div class="rides" id="plans"></div>
    </div>

    <div class="sec-title">Exploration</div>
    <div class="stats" id="stats"></div>

    <div class="sec-title">Last 6 months</div>
    <div class="heat" id="heat"></div>
    <div class="heat-foot" id="heat-foot"></div>

    <div class="sec-title">Rides</div>
    <div class="rides" id="rides"></div>
  </aside>
</main>

<section class="sheet" id="sheet" aria-label="Ride">
  <div class="sheet-head"><span class="t" id="sheet-title">Ride</span><button id="sheet-done">Done</button></div>
  <div class="sheet-body">
    <div class="field"><label for="f-title">Title</label><input id="f-title" maxlength="80" placeholder="Along the Saône to the island"></div>
    <div class="row3">
      <div class="field"><label for="f-date">Date</label><input id="f-date" type="date"></div>
      <div class="field"><label for="f-start">Left</label><input id="f-start" type="time"></div>
      <div class="field"><label for="f-end">Back</label><input id="f-end" type="time"></div>
    </div>
    <div class="ride-info" id="f-info"></div>
    <div class="field" id="f-cps-wrap" hidden><label>Checkpoints</label><div class="cps" id="f-cps" data-owner="ride"></div></div>
    <div class="field"><label>Tags</label><div class="chips" id="f-tags"></div></div>
    <div class="field"><label for="f-note">What I saw</label><textarea id="f-note" placeholder="Places, details, the sandwich stop…"></textarea></div>
    <div class="field"><label for="f-thought">What I thought about</label><textarea id="f-thought" placeholder="Ideas and reflections from the ride"></textarea></div>
    <div class="sheet-actions">
      <button id="f-regpx">⬆ Replace route (GPX)</button>
      <button id="f-redraw">✎ Redraw route</button>
      <button class="del" id="f-delete">Delete ride</button>
    </div>
  </div>
</section>
<section class="sheet" id="psheet" aria-label="Planned route">
  <div class="sheet-head"><span class="t">Planned route</span><button id="psheet-done">Done</button></div>
  <div class="sheet-body">
    <div class="field"><label for="p-title">Title</label><input id="p-title" maxlength="80" placeholder="Monts d'Or loop"></div>
    <div class="ride-info" id="p-info"></div>
    <div class="field"><label>Checkpoints</label><div class="cps" id="p-cps" data-owner="plan"></div></div>
    <div class="sheet-actions">
      <button id="p-ask">📋 Copy request for Claude</button>
      <button id="p-paste-open">Paste checkpoints</button>
    </div>
    <div class="paste" id="p-paste" hidden>
      <textarea id="p-paste-text" placeholder='Paste the JSON from Claude: {"title":…,"points":[…]}'></textarea>
      <div class="paste-err" id="p-paste-err"></div>
      <button id="p-paste-add">Add checkpoints</button>
    </div>
    <div class="field"><label>After the ride</label>
      <div class="sheet-actions">
        <button class="primary" id="p-done-gpx">⬆ Import my ride GPX</button>
        <button id="p-done-plan">Ridden as planned</button>
      </div>
    </div>
    <div class="sheet-actions"><button class="del" id="p-delete">Delete plan</button></div>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  DATA
//  state = { v: 1, settings: { home: [lat, lng] | null }, rides: [ride], plans: [plan] }
//  ride  = { id, date 'YYYY-MM-DD', start 'HH:MM'|'', end 'HH:MM'|'', title, note, thought,
//            tags: [tag id], tr: encoded polyline (1e-5, simplified), km, src: 'gpx' | 'drawn' | 'plan', cps?: [cp] }
//  plan  = { id, date, title, tr (planned route, '' = none), km, cps: [cp] }   — a route to ride, not counted yet
//  cp    = { id, name, lat, lng, what, fact, done }                            — checkpoint, usually pasted from Claude
//  Explored squares = zoom-14 map tiles (~1,7 km wide at Lyon) crossed by any route.
// ════════════════════════════════════════════════════════════════════
const LS_KEY = 'bici_v1';
const GD_FILENAME = 'bici_data.json';
const Z = 14, NT = 1 << Z;                     // explorer square = zoom-14 tile
const DEFAULT_VIEW = [[45.764, 4.836], 12];    // first open, before any ride or home
const TAGS = [
  ['park', '🌳', 'Park'], ['river', '🌊', 'River'], ['arch', '🏛', 'Architecture'], ['picnic', '🧺', 'Picnic'],
  ['village', '🏘', 'Village'], ['view', '⛰', 'Viewpoint'], ['cafe', '☕', 'Café'], ['photos', '📷', 'Photos'],
  ['sunset', '🌅', 'Sunset'], ['forest', '🌲', 'Forest'],

const CLOUD = LifeSync.cloud('bici');

  const fill = k => explored.has(k) ? null : preview.has(k) ? pre : fog;
  const d = coords.z - Z;
  if (d >= 0) {                                  // map tile inside one square
    const k = 1 << d, sx = Math.floor(coords.x / k), sy = Math.floor(coords.y / k);

      const f = fill((coords.x * k + i) + ',' + (coords.y * k + j));
      if (f) { g.fillStyle = f; g.fillRect(i * cs, j * cs, cs, cs); }
    }
    if (cs >= 8) {
      g.strokeStyle = line; g.lineWidth = 1; g.beginPath();

}

});
F('btn-plan').addEventListener('click', () => F('plan-input').click());
F('plan-input').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const added = [], bad = [];
  for (const f of files) {
    try { const p = importPlanGpx(await f.text()); if (p) added.push(p); }
    catch (err) { bad.push(f.name + ': ' + err.message); }
  }
  if (added.length) persist();
  const c = renderAll();
  if (bad.length) toast('Not imported — ' + bad.join(' · '), 6000);
  else if (added.length === 1) toast('Plan added · +' + c.planNew[added[0].id] + ' new squares if you ride it', 5000);
  else if (added.length) toast(added.length + ' plans added');
  else if (files.length) toast('This plan is already here');
  if (added.length === 1) openPlan(added[0].id, true); else if (added.length) fitAll();
});
F('btn-locate').addEventListener('click', () => {
  if (!map) return;
  if (!navigator.geolocation) { toast('Location is not available on this device'); return; }
  toast('Finding you…');
  navigator.geolocation.getCurrentPosition(pos => {
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if (meMarker) meMarker.remove();
    meMarker = L.circleMarker(ll, { radius: 8, color: '#ffffff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).bindTooltip('You').addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 15));
    toast('You are here', 1500);
  }, err => toast('Location: ' + err.message, 4000), { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
});
F('btn-draw').addEventListener('click', () => { if (!map) { toast('The map is not available'); return; } closeSheetSilently(); closePlanSilently(); setMode('draw'); });
F('btn-home').addEventListener('click', () => { if (!map) return; closeSheetSilently(); closePlanSilently(); setMode(mode === 'home' ? null : 'home'); });
F('btn-fit').addEventListener('click', fitAll);
F('btn-fog').addEventListener('click', e => {
  fogOn = !fogOn; e.currentTarget.classList.toggle('on', fogOn);
  if (map) { if (fogOn) fogLayer.addTo(map); else fogLayer.remove(); }
});
function closeSheetSilently() { F('sheet').classList.remove('open'); selId = null; }

let toastTimer = null;
function toast(msg, ms) {
  const el = F('toast'); el.textContent = msg; el.classList.add('visible');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'), ms || 3000);
}

// ════════════════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════════════════
loadLocal();
initMap();
renderAll(true);
cloudLoad();
</script>
</body>
</html>
