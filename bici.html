<!DOCTYPE html>
<html lang="en">
<head>
<script src="lib/pwa.js"></script>
<script src="lib/sync-auth.js"></script>
<script src="lib/sync.js"></script>
<script src="lib/drive.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bici</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #eeede9; --card: #ffffff; --sub: #f5f5f3;
  --text: #1a1a18; --text2: #5f5e5a; --text3: #8a8880;
  --border: rgba(0,0,0,0.11); --border2: rgba(0,0,0,0.2);
  --teal: #0f8a7a; --teal-bg: #def5f0; --teal-tx: #0a5f54; --on-teal: #ffffff;
  --route: #e8590c; --heat0: #e6e5e0; --heat1: #8fd8cb; --heat2: #0f8a7a;
  --danger: #c43c3c;
  --font: 'DM Sans', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --card: #1f1f1d; --sub: #2a2a28;
    --text: #f0ede6; --text2: #a8a69f; --text3: #7a7872;
    --border: rgba(255,255,255,0.09); --border2: rgba(255,255,255,0.18);
    --teal: #3cc4b0; --teal-bg: #12302b; --teal-tx: #9be6da; --on-teal: #0b1f1c;
    --route: #ff8a3d; --heat0: #2e2e2b; --heat1: #1f6b5f; --heat2: #3cc4b0;
    --danger: #e06666;
  }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }
  .leaflet-container { background: #2a2a28; }
}
html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }

/* Header (same pattern as the other widgets) */
.site-header { position: sticky; top: 0; z-index: 1100; background: var(--card); border-bottom: 1px solid var(--border); }
.header-row { max-width: 1400px; margin: 0 auto; height: 52px; padding: 0 14px; display: flex; align-items: center; gap: 12px; }
#home-link { display: flex; align-items: center; opacity: 0.85; text-decoration: none; }
#home-link:hover { opacity: 1; }
.header-sep { width: 1px; height: 26px; background: var(--border); }
.logo { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.logo-main { font-size: 24px; font-weight: 700; letter-spacing: 0.01em; color: var(--teal); line-height: 1; white-space: nowrap; }
@media (max-width: 520px) { .logo-sub { display: none; } }
.logo-sub { font-size: 12px; letter-spacing: 0.16em; color: var(--text2); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#drivesavebtn, #driveloadbtn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 7px 12px; border-radius: 99px; border: none; background: rgba(26,115,232,0.14); color: #1a73e8; white-space: nowrap; }
#drivesavebtn:disabled, #driveloadbtn:disabled { opacity: 0.45; cursor: not-allowed; }
.status-bar { max-width: 1400px; margin: 0 auto; padding: 0 16px 4px; display: flex; gap: 14px; justify-content: center; font-size: 11px; color: var(--text3); min-height: 16px; }
#drive-status { display: none; }
#drive-status.visible { display: block; }
#drive-status.ok { color: var(--teal); } #drive-status.err { color: var(--danger); } #drive-status.working { color: #b25f00; }
#cf-status { display: flex; align-items: center; gap: 5px; }
#cf-status .cf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
#cf-status.ok { color: var(--teal); } #cf-status.ok .cf-dot { background: var(--teal); }
#cf-status.err { color: var(--danger); } #cf-status.err .cf-dot { background: var(--danger); }

/* Layout: map + side panel (side by side from 900 px, stacked below) */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: calc(100vh - 73px); height: calc(100dvh - 73px); }
.map-wrap { position: relative; min-height: 0; }
#map { position: absolute; inset: 0; background: var(--sub); }
.side { min-height: 0; overflow-y: auto; padding: 12px 14px 24px; border-left: 1px solid var(--border); background: var(--bg); }
@media (max-width: 899px) {
  .layout { display: block; height: auto; }
  .map-wrap { height: 56vh; height: 56dvh; }
  .side { border-left: none; overflow: visible; }
}
.map-tools { position: absolute; top: 10px; right: 10px; z-index: 900; display: flex; flex-direction: column; gap: 6px; }
.map-tools button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border2); background: var(--card); font-size: 17px; display: flex; align-items: center; justify-content: center; }
.map-tools button.on { background: var(--teal-bg); border-color: var(--teal); }
.map-hint { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 900; background: var(--card); border: 1px solid var(--border2); border-radius: 12px; padding: 8px 10px; display: none; align-items: center; gap: 8px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.15); max-width: calc(100% - 24px); flex-wrap: wrap; justify-content: center; }
.map-hint.visible { display: flex; }
.map-hint button { border: 1px solid var(--border2); background: var(--sub); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.map-hint button.primary { background: var(--teal); color: var(--on-teal); border-color: var(--teal); }
.no-map { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--text2); font-size: 14px; }

/* Side panel */
.actions { display: flex; gap: 8px; margin-bottom: 12px; }
.actions button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--border2); background: var(--card); font-size: 14px; font-weight: 500; }
.actions button.narrow { flex: none; padding: 0 14px; }
.sec-title { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin: 14px 0 8px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 8px; min-width: 0; }
.stat-l { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-v { font-size: 17px; font-weight: 700; margin-top: 2px; white-space: nowrap; }
.stat-s { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 899px) and (min-width: 600px) { .stats { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 11px); gap: 2px; justify-content: start; }
.heat i { width: 11px; height: 11px; border-radius: 2px; background: var(--heat0); display: block; }
.heat i.l1 { background: var(--heat1); } .heat i.l2 { background: var(--heat2); } .heat i.out { visibility: hidden; }
.heat i.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--heat0); }
.heat-foot { font-size: 11px; color: var(--text3); margin-top: 4px; }
.rides { display: flex; flex-direction: column; gap: 6px; }
.ride { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 9px 11px; }
.ride.sel { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal) inset; }
.ride-date { flex: none; width: 44px; text-align: center; line-height: 1.1; }
.ride-date b { display: block; font-size: 18px; }
.ride-date span { font-size: 11px; color: var(--text2); text-transform: uppercase; }
.ride-main { flex: 1; min-width: 0; }
.ride-thumb { flex: none; width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: var(--sub); }
.photo-box { display: flex; flex-direction: column; gap: 8px; }
.photo-img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; background: var(--sub); display: block; }
.photo-img.loading { filter: blur(6px); }
.arrow-ic { width: 20px; height: 20px; pointer-events: none; }
.ride-title { font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ride-meta { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { flex: none; font-size: 11px; font-weight: 700; color: var(--teal-tx); background: var(--teal-bg); border-radius: 99px; padding: 3px 8px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--card); box-shadow: 0 0 0 1px var(--border2); }
.sw.on { box-shadow: 0 0 0 2px var(--text); }
.ride-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.empty { background: var(--card); border: 1px dashed var(--border2); border-radius: 12px; padding: 14px; font-size: 13px; color: var(--text2); line-height: 1.5; }

/* Ride editor: drawer over the side panel (wide) or bottom sheet (narrow) */
.sheet { position: fixed; z-index: 1200; background: var(--card); border: 1px solid var(--border2); box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: none; flex-direction: column; }
.sheet.open { display: flex; }
@media (min-width: 900px) { .sheet { top: 73px; right: 0; bottom: 0; width: 380px; border-radius: 0; border-top: none; border-right: none; border-bottom: none; } }
@media (max-width: 899px) { .sheet { left: 0; right: 0; bottom: 0; height: 78vh; height: 78dvh; border-radius: 16px 16px 0 0; transition: height 0.2s ease; } }
.sheet.dragging { transition: none; }
.sheet-grip { display: none; }
@media (max-width: 899px) {
  .sheet-grip { display: flex; justify-content: center; padding: 8px 0 2px; cursor: grab; touch-action: none; }
  .sheet-grip span { width: 42px; height: 5px; border-radius: 3px; background: var(--border2); }
  .sheet-head { touch-action: none; }
}
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.sheet-head .t { flex: 1; font-weight: 700; font-size: 15px; }
.sheet-head button { border: none; background: var(--teal); color: var(--on-teal); border-radius: 10px; padding: 8px 14px; font-weight: 500; }
.sheet-body { overflow-y: auto; padding: 12px 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-bottom: 4px; }
.field input, .field textarea { width: 100%; border: 1px solid var(--border2); background: var(--sub); border-radius: 10px; padding: 9px 10px; font-size: 15px; }
.field textarea { min-height: 84px; resize: vertical; line-height: 1.4; }
.row3 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.row3 input { min-width: 0; padding: 9px 6px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border2); background: var(--sub); border-radius: 99px; padding: 6px 10px; font-size: 13px; }
.chip.on { background: var(--teal-bg); border-color: var(--teal); color: var(--teal-tx); font-weight: 500; }
.ride-info { font-size: 13px; color: var(--text2); background: var(--sub); border-radius: 10px; padding: 8px 10px; }
.sheet-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet-actions button { border: 1px solid var(--border2); background: var(--sub); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.sheet-actions button.del { color: var(--danger); margin-left: auto; }
.toast { position: fixed; left: 50%; top: 84px; transform: translateX(-50%); z-index: 1300; background: var(--text); color: var(--bg); border-radius: 10px; padding: 9px 14px; font-size: 13px; max-width: calc(100% - 24px); display: none; }
.toast.visible { display: block; }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a id="home-link" href="index.html" title="Back to Life Hub">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="13.5" stroke="url(#hl-g1)" stroke-width="1.2" fill="none" opacity="0.7"/>
        <ellipse cx="16" cy="16" rx="13.5" ry="5.5" stroke="url(#hl-g2)" stroke-width="1" fill="none" opacity="0.55" transform="rotate(-35 16 16)"/>
        <ellipse cx="16" cy="16" rx="13.5" ry="5.5" stroke="url(#hl-g3)" stroke-width="1" fill="none" opacity="0.45" transform="rotate(35 16 16)"/>
        <circle cx="16" cy="16" r="2.5" fill="url(#hl-g4)"/>

        <defs>
          <linearGradient id="hl-g1" x1="2.5" y1="2.5" x2="29.5" y2="29.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7dd3fc"/>
          </linearGradient>
          <linearGradient id="hl-g2" x1="2.5" y1="2.5" x2="29.5" y2="29.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#00e5a0"/>
          </linearGradient>
          <linearGradient id="hl-g3" x1="2.5" y1="29.5" x2="29.5" y2="2.5" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#a78bfa"/>
          </linearGradient>
          <radialGradient id="hl-g4" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#a78bfa"/>
          </radialGradient>

    <div class="header-sep"></div>
    <div class="logo"><span class="logo-main"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--route)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-4px;margin-right:4px"><circle cx="5.5" cy="16" r="3.5"/><circle cx="18.5" cy="16" r="3.5"/><path d="M5.5 16 9 9h7l2.5 7M9 9l3 7h-6.5M16 9l-4 7M7.5 7h3M16 9l-1-3h2.5"/></svg>Bici</span><span class="logo-sub">Rides &amp; exploration</span></div>
    <button id="drivesavebtn" title="Save to Google Drive">☁ Save</button>
    <button id="driveloadbtn" title="Load from Google Drive">☁ Load</button>
  </div>
  <div class="status-bar">
    <span id="cf-status"><span class="cf-dot"></span><span id="cf-status-msg"></span></span>
    <span id="drive-status"></span>

</header>

<main class="layout">
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-tools">
      <button id="btn-fog" class="on" title="Show / hide the fog">🌫</button>
      <button id="btn-home" title="Set home: then tap the map">⌂</button>
      <button id="btn-fit" title="Show all rides">⤢</button>
    </div>
    <div class="map-hint" id="map-hint"></div>
  </div>

  <aside class="side">
    <div class="actions">
      <button id="btn-import">⬆ Import GPX from Komoot</button>
      <button id="btn-draw" class="narrow" title="Draw a ride on the map">✎ Draw</button>
    </div>
    <input type="file" id="gpx-input" multiple hidden>

    <div class="sec-title">Exploration</div>
    <div class="stats" id="stats"></div>

    <div class="sec-title" id="heat-title">Last 6 months</div>
    <div class="heat" id="heat"></div>
    <div class="heat-foot" id="heat-foot"></div>

    <div class="sec-title">Rides</div>

</main>

<section class="sheet" id="sheet" aria-label="Ride">
  <div class="sheet-grip" id="sheet-grip" title="Drag to see more of the map"><span></span></div>
  <div class="sheet-head"><span class="t" id="sheet-title">Ride</span><button id="sheet-done">Done</button></div>
  <div class="sheet-body">
    <div class="field"><label for="f-title">Title</label><input id="f-title" maxlength="80" placeholder="Along the Saône to the island"></div>
    <div class="row3">
      <div class="field"><label for="f-date">Date</label><input id="f-date" type="date"></div>
      <div class="field"><label for="f-start">Left</label><input id="f-start" type="time"></div>
      <div class="field"><label for="f-end">Back</label><input id="f-end" type="time"></div>
    </div>
    <div class="ride-info" id="f-info"></div>
    <div class="field"><label>Route colour</label><div class="swatches" id="f-colors"></div></div>
    <div class="field"><label>Tags</label><div class="chips" id="f-tags"></div></div>
    <div class="field"><label>Photo</label>
      <div class="photo-box">
        <img class="photo-img" id="f-photo" alt="Photo of the ride" hidden>
        <div class="sheet-actions">
          <button id="f-photo-add">📷 Add a photo</button>
          <button class="del" id="f-photo-del" hidden>Remove photo</button>
        </div>
      </div>
      <input type="file" id="photo-input" accept="image/*" hidden>
    </div>
    <div class="field"><label for="f-note">What I saw</label><textarea id="f-note" placeholder="Places, details, the sandwich stop…"></textarea></div>
    <div class="field"><label for="f-thought">What I thought about</label><textarea id="f-thought" placeholder="Ideas and reflections from the ride"></textarea></div>
    <div class="sheet-actions">
      <button id="f-regpx">⬆ Replace route (GPX)</button>
      <button id="f-redraw">✎ Redraw route</button>
      <button class="del" id="f-delete">Delete ride</button>
    </div>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════════════
//  DATA
//  state = { v: 1, settings: { home: [lat, lng] | null }, rides: [ride] }
//  ride  = { id, date 'YYYY-MM-DD', start 'HH:MM'|'', end 'HH:MM'|'', title, note, thought,
//            tags: [tag id], tr: encoded polyline (1e-5, simplified), km, src: 'gpx' | 'drawn' | 'plan' (older saves) }
//  Explored squares = zoom-16 map tiles (~430 m wide at Lyon) crossed by any route. ride.color = route colour (palette).
//  Photo: one per ride. Full photo (JPEG ≤ 1280 px) in its own cloud key 'bici-ph-<ride id>' = { v: 1, img: dataURL };
//  the ride keeps only photo: true and thumb (small JPEG dataURL) so the list shows it without loading anything.
// ════════════════════════════════════════════════════════════════════
const LS_KEY = 'bici_v1';
const GD_FILENAME = 'bici_data.json';
const Z = 16, NT = 1 << Z;                     // explorer square = zoom-16 tile (~430 m wide at Lyon)
const DEFAULT_VIEW = [[45.764, 4.836], 12];    // first open, before any ride or home
const TAGS = [
  ['park', '🌳', 'Park'], ['river', '🌊', 'River'], ['arch', '🏛', 'Architecture'], ['picnic', '🧺', 'Picnic'],
  ['village', '🏘', 'Village'], ['view', '⛰', 'Viewpoint'], ['cafe', '☕', 'Café'], ['photos', '📷', 'Photos'],
  ['sunset', '🌅', 'Sunset'], ['forest', '🌲', 'Forest'], ['lunch', '🥪', 'Lunch'], ['tunnel', '🚇', 'Tunnel'],
  ['short', '🔸', 'Short'], ['long', '🛣', 'Long'],
];
const TAG = Object.fromEntries(TAGS.map(t => [t[0], t]));
const COLORS = ['#e8590c', '#1c7ed6', '#d6336c', '#0ca678', '#7048e8', '#f59f00', '#c92a2a', '#0b7285', '#5c940d', '#862e9c'];
// Least used palette colour among these rides (palette order breaks ties)
function pickColor(rides) {
  const used = new Map(COLORS.map(c => [c, 0]));
  for (const r of rides) if (used.has(r.color)) used.set(r.color, used.get(r.color) + 1);
  let best = COLORS[0];
  for (const c of COLORS) if (used.get(c) < used.get(best)) best = c;
  return best;
}

let state = { v: 1, settings: { home: null }, rides: [] };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function n1(x) { return x.toLocaleString('de-DE', { minimumFractionDigits: 1, maximumFractionDigits: 1 }); }
function pad(n) { return String(n).padStart(2, '0'); }
function localDate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function localTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function todayStr() { return localDate(new Date()); }
function newId() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// ── Geometry ──
const R_EARTH = 6371008.8;
function distM(a, b) {
  const r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(h)));
}
function pathKm(pts) { let m = 0; for (let i = 1; i < pts.length; i++) m += distM(pts[i - 1], pts[i]); return m / 1000; }

// Douglas–Peucker in a local metric projection (keeps the shape within tolM metres)
function simplify(pts, tolM) {
  if (pts.length < 3) return pts.slice();

  hint();
}
function hint() {
  const el = document.getElementById('map-hint');
  if (mode === 'home') {
    el.innerHTML = '<span>Tap your home on the map</span><button data-a="cancel">Cancel</button>';
  } else if (mode === 'draw') {
    const km = drawPts.length > 1 ? n1(pathKm(drawPts)) + ' km' : '';
    el.innerHTML = `<span>Tap along your route · ${drawPts.length} pts ${km ? '· ' + km : ''}</span>` +
      '<button data-a="undo">Undo</button><button data-a="cancel">Cancel</button><button class="primary" data-a="save">Save</button>';
  } else { el.innerHTML = ''; }
  el.classList.toggle('visible', !!mode);
}
document.getElementById('map-hint').addEventListener('click', e => {
  const a = e.target.dataset && e.target.dataset.a; if (!a) return;
  if (a === 'cancel') setMode(null);
  else if (a === 'undo') { drawPts.pop(); updateDrawLine(); hint(); }
  else if (a === 'save') finishDraw();
});
function updateDrawLine() {
  if (!map) return;
  if (!drawLine) drawLine = L.polyline([], { color: cssVar('--teal') || '#0f8a7a', weight: 4, dashArray: '8 6' }).addTo(map);
  drawLine.setLatLngs(drawPts);
}
function onMapClick(e) {
  const p = [Math.round(e.latlng.lat * 1e5) / 1e5, Math.round(e.latlng.lng * 1e5) / 1e5];
  if (mode === 'home') { state.settings.home = roundHome(p); setMode(null); persist(); renderAll(); toast('Home saved'); }
  else if (mode === 'draw') { drawPts.push(p); updateDrawLine(); hint(); }
}
function finishDraw() {
  if (drawPts.length < 2) { toast('Tap at least 2 points'); return; }
  const f = routeFields(drawPts), into = drawInto;
  let r;
  if (into && (r = state.rides.find(x => x.id === into))) Object.assign(r, f, { src: 'drawn' });
  else {
    r = { id: newId(), color: pickColor(state.rides), date: todayStr(), start: '', end: '', title: '', note: '', thought: '', tags: [], ...f, src: 'drawn' };
    state.rides.push(r);
    if (!state.settings.home) state.settings.home = roundHome(drawPts[0]);
  }
  setMode(null); persist(); renderAll(); openRide(r.id);
}

// ════════════════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════════════════
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function renderAll(refit) {
  const c = compute(state);
  renderStats(c); renderHeat(c); renderList(c); drawMap(c);
  if (refit) fitAll();
  return c;
}
function stat(label, value, sub) {
  return `<div class="stat"><div class="stat-l">${esc(label)}</div><div class="stat-v">${esc(value)}</div><div class="stat-s">${esc(sub || '\u00a0')}</div></div>`;
}
function renderStats(c) {
  const lastNew = c.last ? c.per[c.last.id].newSq : 0;
  const h = c.mins / 60;
  document.getElementById('stats').innerHTML =
    stat('Rides', c.rides.length, c.yN + ' in ' + c.year) +
    stat('Distance', c.km ? (c.km >= 100 ? Math.round(c.km).toLocaleString('de-DE') : n1(c.km)) + ' km' : '—', 'all rides') +
    stat('Average', c.rides.length ? n1(c.avgKm) + ' km' : '—', 'per ride') +
    stat('Outside', c.mins ? (h >= 10 ? Math.round(h) : n1(h)) + ' h' : '—', c.avgMins ? 'avg ' + Math.floor(c.avgMins / 60) + 'h' + pad(Math.round(c.avgMins % 60)) : '') +
    stat('Squares', c.sq, c.last ? '+' + lastNew + ' last' : 'explored') +
    stat('Max square', c.max.n ? c.max.n + '×' + c.max.n : '—', 'complete') +
    stat('Farthest', c.farKm !== null ? n1(c.farKm) + ' km' : '—', 'from home') +
    stat('Near home', c.cov10 !== null ? Math.round(c.cov10 * 100) + '%' : '—', 'within 10 km');
}
// Calendar grid: starts on the week of the first ride (at most 26 weeks back), runs to the end of the
// current month (at least 8 weeks); days still to come are drawn as empty outlines
const HEAT_WEEKS = 26, HEAT_MIN_WEEKS = 8;
function monday(d) { const m = new Date(d); m.setHours(12, 0, 0, 0); m.setDate(m.getDate() - (m.getDay() + 6) % 7); return m; }
function heatRange(rides, today) {
  const t = new Date(today); t.setHours(12, 0, 0, 0);
  const limit = monday(t); limit.setDate(limit.getDate() - (HEAT_WEEKS - 1) * 7);
  const first = rides.length ? new Date(rides[0].date + 'T12:00:00') : t;
  const start = monday(first < limit ? limit : first);
  const end = new Date(t.getFullYear(), t.getMonth() + 1, 0, 12);                 // last day of this month
  const minEnd = new Date(start); minEnd.setDate(minEnd.getDate() + HEAT_MIN_WEEKS * 7 - 1);
  const last = end > minEnd ? end : minEnd;
  last.setDate(last.getDate() + (7 - last.getDay()) % 7);                          // finish the week on Sunday
  return { start, last, rolling: first < limit };
}
function renderHeat(c) {
  const count = {};
  for (const r of c.rides) count[r.date] = (count[r.date] || 0) + 1;
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const { start, last, rolling } = heatRange(c.rides, today);
  let html = '', n = 0;
  for (const d = new Date(start); d <= last; d.setDate(d.getDate() + 1)) {
    const k = localDate(d), v = count[k] || 0, fut = d > today;
    if (v && !fut) n += v;
    html += `<i class="${fut ? 'fut' : v > 1 ? 'l2' : v ? 'l1' : ''}" title="${k}${v ? ' · ' + v + ' ride' + (v > 1 ? 's' : '') : ''}"></i>`;
  }
  const since = start.getDate() + ' ' + MONTHS[start.getMonth()];
  document.getElementById('heat-title').textContent = rolling || !c.rides.length ? 'Last 6 months' : 'Since ' + since;
  document.getElementById('heat').innerHTML = html;
  document.getElementById('heat-foot').textContent = n + ' ride' + (n === 1 ? '' : 's') + ' since ' + since;
}
function renderList(c) {
  const el = document.getElementById('rides');
  if (!c.rides.length) {
    el.innerHTML = '<div class="empty">No rides yet. After a ride: Komoot → your recorded tour → ⋮ → <b>Download GPX file</b>, then <b>Import GPX</b> here. ' +
      'No GPX? Draw it with <b>✎ Draw</b>.</div>';
    return;
  }
  el.innerHTML = c.rides.slice().reverse().map(r => {
    const d = new Date(r.date + 'T12:00:00'), m = rideMinutes(r);
    const meta = [r.tags.map(t => TAG[t][1]).join(''), n1(r.km) + ' km', m ? Math.floor(m / 60) + 'h' + pad(m % 60) : ''].filter(Boolean).join(' · ');
    const nw = c.per[r.id].newSq;
    return `<button class="ride${r.id === selId ? ' sel' : ''}" data-id="${esc(r.id)}">` +
      `<div class="ride-date"><b>${d.getDate()}</b><span>${MONTHS[d.getMonth()]}</span></div>` +
      `<div class="ride-main"><div class="ride-title"><span class="ride-dot" style="background:${esc(r.color || '#888')}"></span>${esc(r.title || 'Ride')}</div><div class="ride-meta">${esc(meta)}</div></div>` +
      (r.thumb ? `<img class="ride-thumb" src="${esc(r.thumb)}" alt="">` : '') +
      (nw ? `<span class="badge">+${nw}</span>` : '') + '</button>';
  }).join('');
}
document.getElementById('rides').addEventListener('click', e => {
  const b = e.target.closest('.ride'); if (b) openRide(b.dataset.id, true);
});

// ── Ride editor ──
const F = id => document.getElementById(id);
function openRide(id, fit) {
  const r = state.rides.find(x => x.id === id); if (!r) return;
  selId = id;
  F('f-title').value = r.title; F('f-date').value = r.date; F('f-start').value = r.start; F('f-end').value = r.end;
  F('f-note').value = r.note; F('f-thought').value = r.thought;
  setSheetHeight(null);                              // every ride opens at full height
  showPhoto(r);
  renderSheet();
  F('sheet').classList.add('open');
  const c = renderAll();
  if (fit) fitRide(r);
  return c;
}
function renderSheet() {
  const r = state.rides.find(x => x.id === selId); if (!r) return;
  const c = compute(state), m = rideMinutes(r), d = new Date(r.date + 'T12:00:00');
  F('sheet-title').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  F('f-info').textContent = [n1(r.km) + ' km', m ? Math.floor(m / 60) + 'h' + pad(m % 60) + ' outside' : '',
    '+' + c.per[r.id].newSq + ' new squares', r.src === 'drawn' ? 'route drawn by hand' : r.src === 'plan' ? 'route as planned' : 'route from GPX'].filter(Boolean).join(' · ');
  F('f-tags').innerHTML = TAGS.map(t => `<button class="chip${r.tags.includes(t[0]) ? ' on' : ''}" data-t="${t[0]}">${t[1]} ${t[2]}</button>`).join('');
  F('f-colors').innerHTML = COLORS.map(col => `<button class="sw${r.color === col ? ' on' : ''}" data-c="${col}" style="background:${col}" aria-label="Colour ${col}"></button>`).join('');
}
// ── Bottom sheet (narrow screens): drag the grip or the header between 3 heights; a tap toggles small ↔ full ──
const sheetNarrow = () => matchMedia('(max-width: 899px)').matches;
function sheetStops() {
  const vh = window.innerHeight, head = F('sheet-grip').offsetHeight + document.querySelector('#sheet .sheet-head').offsetHeight;
  return [head, Math.round(vh * 0.45), Math.round(vh * 0.78)];
}
function setSheetHeight(h) {
  F('sheet').style.height = h === null ? '' : h + 'px';
  if (h !== null && h < sheetStops()[2] - 1) window.scrollTo({ top: 0, behavior: 'smooth' });   // bring the map into view
}
(function () {
  const sheet = F('sheet');
  let startY = 0, startH = 0, moved = false, dragging = false;
  function down(e) {
    if (!sheetNarrow() || e.target.closest('button')) return;
    dragging = true; moved = false; startY = e.clientY; startH = sheet.getBoundingClientRect().height;
    sheet.classList.add('dragging'); e.currentTarget.setPointerCapture(e.pointerId);
  }
  function move(e) {
    if (!dragging) return;
    const dy = e.clientY - startY; if (Math.abs(dy) > 5) moved = true;
    const [lo, , hi] = sheetStops();
    sheet.style.height = Math.max(lo, Math.min(hi, startH - dy)) + 'px';
  }
  function up() {
    if (!dragging) return;
    dragging = false; sheet.classList.remove('dragging');
    const stops = sheetStops(), h = sheet.getBoundingClientRect().height;
    if (!moved) { setSheetHeight(h > stops[0] + 2 ? stops[0] : stops[2]); return; }
    setSheetHeight(stops.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a));
  }
  for (const el of [F('sheet-grip'), sheet.querySelector('.sheet-head')]) {
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  }
})();
function closeSheet() { F('sheet').classList.remove('open'); selId = null; renderAll(); }
function editRide(fn) {
  const r = state.rides.find(x => x.id === selId); if (!r) return;
  fn(r); persist();
}
let listTimer = null;
function onField(key, max) {
  return e => editRide(r => { r[key] = e.target.value.slice(0, max); clearTimeout(listTimer); listTimer = setTimeout(() => { renderAll(); renderSheet(); }, 400); });
}
F('f-title').addEventListener('input', onField('title', 80));
F('f-note').addEventListener('input', onField('note', 5000));
F('f-thought').addEventListener('input', onField('thought', 5000));
F('f-start').addEventListener('change', onField('start', 5));
F('f-end').addEventListener('change', onField('end', 5));
F('f-date').addEventListener('change', e => { if (/^\d{4}-\d\d-\d\d$/.test(e.target.value)) editRide(r => { r.date = e.target.value; }); renderAll(); renderSheet(); });
F('f-colors').addEventListener('click', e => {
  const b = e.target.closest('.sw'); if (!b) return;
  editRide(r => { r.color = b.dataset.c; });
  renderSheet(); renderAll();
});
F('f-tags').addEventListener('click', e => {
  const t = e.target.closest('.chip'); if (!t) return;
  editRide(r => { const k = t.dataset.t; r.tags = r.tags.includes(k) ? r.tags.filter(x => x !== k) : [...r.tags, k]; });
  renderSheet(); renderAll();
});
F('sheet-done').addEventListener('click', closeSheet);
// ── Photo: one per ride; full image in its own cloud key, only thumb + flag in the ride ──
const PHOTO_MAX = 1280, THUMB_MAX = 160;
const photoCache = new Map();                        // ride id → full dataURL (this page only)
const photoKey = id => 'bici-ph-' + id;
async function loadBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }      // keeps phone photos upright
  catch (_) {
    const url = URL.createObjectURL(file);
    try { const img = new Image(); img.src = url; await img.decode(); return img; } finally { URL.revokeObjectURL(url); }
  }
}
function toJpeg(src, max, quality) {
  const w = src.width, h = src.height, k = Math.min(1, max / Math.max(w, h));
  const cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(w * k)); cv.height = Math.max(1, Math.round(h * k));
  const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(src, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', quality);
}
async function makePhoto(file) {
  const bmp = await loadBitmap(file);
  let full = toJpeg(bmp, PHOTO_MAX, 0.8);
  if (full.length > 700000) full = toJpeg(bmp, PHOTO_MAX, 0.6);                   // keep each photo well under ~0,5 MB
  return { full, thumb: toJpeg(bmp, THUMB_MAX, 0.7) };
}
async function savePhoto(rideId, file) {
  const { full, thumb } = await makePhoto(file);
  await LifeSync.request('/data/' + photoKey(rideId), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ v: 1, img: full }) });
  const r = state.rides.find(x => x.id === rideId); if (!r) return;
  r.photo = true; r.thumb = thumb; photoCache.set(rideId, full); persist();
}
async function dropPhoto(rideId) {                    // best effort: the ride forgets the photo even if the cloud can't be reached
  photoCache.delete(rideId);
  try { await LifeSync.request('/data/' + photoKey(rideId), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); }
  catch (e) { console.warn('Photo delete failed', e); }
}
let photoReq = 0;
async function showPhoto(r) {
  const img = F('f-photo'), req = ++photoReq;
  F('f-photo-add').textContent = r.photo ? '📷 Replace photo' : '📷 Add a photo';
  F('f-photo-del').hidden = !r.photo;
  img.hidden = !r.photo;
  if (!r.photo) { img.removeAttribute('src'); return; }
  const cached = photoCache.get(r.id);
  if (cached) { img.src = cached; img.classList.remove('loading'); return; }
  if (r.thumb) { img.src = r.thumb; img.classList.add('loading'); }
  try {
    const res = await LifeSync.request('/data/' + photoKey(r.id));
    const d = await res.json();
    if (d && typeof d.img === 'string' && d.img.startsWith('data:image/')) photoCache.set(r.id, d.img);
    if (req !== photoReq) return;                      // another ride was opened meanwhile
    if (photoCache.has(r.id)) img.src = photoCache.get(r.id);
  } catch (e) { console.warn('Photo load failed', e); }
  if (req === photoReq) img.classList.remove('loading');
}
F('f-photo-add').addEventListener('click', () => F('photo-input').click());
F('photo-input').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  const id = selId; if (!file || !id) return;
  const btn = F('f-photo-add'); btn.disabled = true; btn.textContent = 'Saving photo…';
  try { await savePhoto(id, file); toast('Photo saved'); }
  catch (err) { console.warn('Photo save failed', err); toast('Photo not saved — check your connection and try again', 5000); }
  btn.disabled = false;
  const r = state.rides.find(x => x.id === id);
  if (r && selId === id) showPhoto(r);
  renderAll();
});
F('f-photo-del').addEventListener('click', async () => {
  const r = state.rides.find(x => x.id === selId); if (!r || !r.photo) return;
  if (!confirm('Remove the photo of this ride?')) return;
  delete r.photo; delete r.thumb; persist(); showPhoto(r); renderAll();
  await dropPhoto(r.id);
});
F('f-delete').addEventListener('click', () => {
  const r = state.rides.find(x => x.id === selId); if (!r) return;
  if (!confirm('Delete this ride (' + r.date + ')? This cannot be undone.')) return;
  state.rides = state.rides.filter(x => x.id !== r.id); persist(); closeSheet();
  if (r.photo) dropPhoto(r.id);
});
F('f-redraw').addEventListener('click', () => { const id = selId; F('sheet').classList.remove('open'); setMode('draw', id); toast('Tap the new route, then Save'); });

// ── Import ──
let importInto = null;
F('btn-import').addEventListener('click', () => { importInto = null; F('gpx-input').click(); });
F('f-regpx').addEventListener('click', () => { importInto = selId; F('gpx-input').click(); });
F('gpx-input').addEventListener('change', async e => {
  const files = [...e.target.files]; e.target.value = '';
  const hadHome = !!state.settings.home;
  let added = [], dup = 0, bad = [];
  for (const f of files) {
    try {
      const r = importGpxText(await f.text(), importInto);
      if (r) added.push(r); else dup++;
    } catch (err) { bad.push(f.name + ': ' + err.message); }
  }
  if (added.length) persist();
  const c = renderAll();
  if (bad.length) toast('Not imported — ' + bad.join(' · '), 6000);
  else if (added.length) {
    const nw = added.reduce((s, r) => s + c.per[r.id].newSq, 0);
    toast((importInto ? 'Route replaced' : added.length + ' ride' + (added.length > 1 ? 's' : '') + ' imported') + ' · +' + nw + ' new squares' +
      (!hadHome && state.settings.home ? ' · home set at the start (change with ⌂)' : '') + (dup ? ' · ' + dup + ' already here' : ''), 5000);
  } else if (dup) toast('Already imported');
  if (added.length === 1) openRide(added[0].id, true); else if (added.length) fitAll();
  importInto = null;
});
F('btn-draw').addEventListener('click', () => { if (!map) { toast('The map is not available'); return; } closeSheetSilently(); setMode('draw'); });
F('btn-home').addEventListener('click', () => { if (!map) return; closeSheetSilently(); setMode(mode === 'home' ? null : 'home'); });
F('btn-fit').addEventListener('click', fitAll);
F('btn-fog').addEventListener('click', e => {
  fogOn = !fogOn; e.currentTarget.classList.toggle('on', fogOn);
  if (map) { if (fogOn) fogLayer.addTo(map); else fogLayer.remove(); }
});
function closeSheetSilently() { F('sheet').classList.remove('open'); selId = null; }

let toastTimer = null;
function toast(msg, ms) {
  const el = F('toast'); el.textContent = msg; el.classList.add('visible');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('visible'), ms || 3000);
}

// ════════════════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════════════════
loadLocal();
initMap();
renderAll(true);
cloudLoad();
</script>
</body>
